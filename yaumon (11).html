<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>飛劍 · 御劍尋蹤</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e14; touch-action: none;
        }

        /* ========== 地圖 ========== */
        #map {
            position: absolute; inset: 0; width: 100%; height: 100%;
            z-index: 1; background: #141a22;
        }
        .leaflet-tile-pane {
            filter: brightness(0.7) saturate(0.6) contrast(1.1) hue-rotate(180deg) invert(0.05);
        }

        /* ============================================================ */
        /* 玩家等級 HUD（左上） */
        /* ============================================================ */
        #player-hud {
            position: absolute; top: 0; left: 0; z-index: 800;
            display: flex; align-items: center; gap: 10px;
            padding: 12px 14px;
            padding-top: calc(12px + env(safe-area-inset-top, 0px));
            pointer-events: none;
        }
        .avatar {
            width: 46px; height: 46px; border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #2a3a55, #0f1520);
            border: 2px solid rgba(126, 200, 255, 0.6);
            box-shadow: 0 0 16px rgba(60, 160, 255, 0.5);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; flex-shrink: 0;
        }
        .player-info {
            display: flex; flex-direction: column; gap: 4px; min-width: 120px;
            background: rgba(10, 14, 20, 0.78);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 180, 255, 0.18);
            border-radius: 12px; padding: 6px 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .player-name-row {
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }
        .player-name { font-size: 12px; font-weight: 700; color: #c8e0ff; letter-spacing: 0.5px; }
        .player-level { font-size: 11px; font-weight: 800; color: #ffd166; font-variant-numeric: tabular-nums; }
        .exp-bar { height: 5px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden; }
        .exp-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #7ec8ff, #4a9eff);
            border-radius: 3px; transition: width 0.4s ease-out;
            box-shadow: 0 0 8px rgba(126, 200, 255, 0.7);
        }

        /* ============================================================ */
        /* 右上徽章 */
        /* ============================================================ */
        #top-badges {
            position: absolute; top: 0; right: 0; z-index: 800;
            display: flex; gap: 8px;
            padding: 12px 14px;
            padding-top: calc(12px + env(safe-area-inset-top, 0px));
            pointer-events: none;
        }
        .badge {
            background: rgba(10, 14, 20, 0.78);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 180, 255, 0.18);
            border-radius: 12px; padding: 6px 12px;
            display: flex; align-items: center; gap: 6px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .badge-label { font-size: 10px; font-weight: 400; color: #6a8aaf; letter-spacing: 1.2px; text-transform: uppercase; }
        .badge .value { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
        #score-panel .value { color: #ffd166; }
        #hp-panel .value { color: #ff6b7a; }

        .badge-btn {
            position: relative;
            background: rgba(10, 14, 20, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 180, 255, 0.22);
            border-radius: 12px;
            width: 46px; height: 46px;
            font-size: 20px;
            cursor: pointer; pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.12s;
        }
        .badge-btn:active { transform: scale(0.92); }
        #inv-badge {
            position: absolute; top: -4px; right: -4px;
            background: #ff6b7a; color: #fff;
            font-size: 10px; font-weight: 800;
            min-width: 18px; height: 18px; border-radius: 9px;
            display: none; align-items: center; justify-content: center;
            padding: 0 4px;
            box-shadow: 0 0 8px rgba(255, 80, 100, 0.6);
        }

        /* ============================================================ */
        /* 地圖控制元件 */
        /* ============================================================ */
        #map-controls {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            z-index: 800; display: flex; flex-direction: column; gap: 8px;
            pointer-events: none;
        }
        .map-btn {
            width: 44px; height: 44px; border-radius: 12px;
            background: rgba(10, 14, 20, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 180, 255, 0.22);
            color: #c8e0ff; font-size: 18px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.12s, background 0.15s;
        }
        .map-btn:active { transform: scale(0.92); background: rgba(30, 50, 80, 0.95); }
        .compass-btn { border-radius: 50%; }
        .compass-arrow {
            display: inline-block; font-size: 18px; color: #ff6b7a;
            transition: transform 0.15s ease-out;
            text-shadow: 0 0 8px rgba(255, 80, 100, 0.8);
        }

        /* ============================================================ */
        /* 雷達 */
        /* ============================================================ */
        #radar-panel {
            position: absolute; left: 12px;
            bottom: calc(64px + env(safe-area-inset-bottom, 0px));
            z-index: 800; width: min(240px, 62vw);
            background: rgba(10, 14, 20, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 180, 255, 0.2);
            border-radius: 14px; overflow: hidden;
            pointer-events: auto; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .radar-header {
            padding: 8px 12px; font-size: 12px; font-weight: 700; color: #7ec8ff;
            letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(100, 180, 255, 0.1);
            cursor: pointer; user-select: none;
        }
        .radar-header .radar-count {
            background: rgba(255, 100, 100, 0.2); color: #ff9a9a;
            border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 800;
        }
        .radar-toggle { font-size: 10px; color: #6a8aaf; transition: transform 0.2s; }
        #radar-panel.collapsed .radar-toggle { transform: rotate(-90deg); }
        .radar-list { max-height: 132px; overflow-y: auto; padding: 4px; scrollbar-width: none; }
        .radar-list::-webkit-scrollbar { display: none; }
        #radar-panel.collapsed .radar-list { display: none; }
        .radar-empty { padding: 12px; text-align: center; font-size: 11px; color: #4a6a8a; }
        .radar-item {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 8px; border-radius: 8px;
            font-size: 12px; color: #a8c8e8; cursor: pointer;
            transition: background 0.15s;
        }
        .radar-item:active { background: rgba(100, 180, 255, 0.12); }
        .radar-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ff9a9a, #cc2244);
            box-shadow: 0 0 8px rgba(255, 60, 60, 0.6); flex-shrink: 0;
        }
        .radar-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .radar-dist { color: #6a8aaf; font-variant-numeric: tabular-nums; font-size: 11px; }

        /* ============================================================ */
        /* 底部狀態 */
        /* ============================================================ */
        #status-bar {
            position: absolute; bottom: 0; left: 0; right: 0;
            z-index: 800; display: flex; justify-content: center;
            padding: 12px 16px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            pointer-events: none;
        }
        #status-text {
            background: rgba(10, 14, 20, 0.78);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 180, 255, 0.15);
            border-radius: 24px; padding: 8px 22px;
            color: #9ab8d8; font-size: 13px; font-weight: 500; letter-spacing: 0.3px;
            text-align: center;
            max-width: 90vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* ============================================================ */
        /* 目標標記 */
        /* ============================================================ */
        .target-marker {
            position: relative; width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            animation: targetFloat 2s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(255, 80, 80, 0.6));
        }
        .target-marker .target-core {
            width: 30px; height: 30px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ff9a9a, #cc2244);
            border: 2px solid rgba(255, 200, 200, 0.7);
            box-shadow: 0 0 20px rgba(255, 60, 60, 0.5);
            position: relative;
        }
        .target-marker .target-core::after {
            content: '妖'; position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 13px; font-weight: 800;
            text-shadow: 0 0 4px rgba(0,0,0,0.5);
        }
        .target-marker .target-ring {
            position: absolute; inset: -6px; border-radius: 50%;
            border: 2px solid rgba(255, 100, 100, 0.35);
            animation: ringPulse 1.8s ease-out infinite;
        }
        .target-distance {
            position: absolute; top: 42px; left: 50%; transform: translateX(-50%);
            font-size: 10px; font-weight: 700; color: #c8e0ff;
            background: rgba(10, 14, 20, 0.72);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            padding: 1px 7px; border-radius: 8px;
            border: 1px solid rgba(100, 180, 255, 0.18);
            white-space: nowrap; pointer-events: none;
            font-variant-numeric: tabular-nums;
        }
        @keyframes targetFloat { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
        @keyframes ringPulse { 0% { transform: scale(0.7); opacity: 0.8; } 100% { transform: scale(1.4); opacity: 0; } }
        .target-marker.elite { width: 60px; height: 60px; filter: drop-shadow(0 0 14px rgba(190, 100, 255, 0.9)); }
        .target-marker.elite .target-core {
            width: 40px; height: 40px;
            background: radial-gradient(circle at 35% 35%, #e0a0ff, #6a1fb0);
            border-color: rgba(255, 220, 120, 0.95);
            box-shadow: 0 0 26px rgba(190, 100, 255, 0.8);
        }
        .target-marker.elite .target-core::after { content: '精'; font-size: 16px; }
        .target-marker.elite .target-ring { border-color: rgba(255, 210, 100, 0.6); }
        .target-marker.elite .target-distance { top: 54px; }
        .collection-card { cursor: pointer; }
        .fuse-card { cursor: pointer; }
        .target-marker.shiny .spr { filter: hue-rotate(70deg) saturate(1.5) drop-shadow(0 0 5px #ffe08a); }
        .egg-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 8px; border-radius: 12px; background: rgba(255,209,102,0.06); border: 1px solid rgba(255,209,102,0.18); }
        .egg-ico { font-size: 26px; }
        #btn-raid-leave { position: absolute; right: 14px; z-index: 4; top: calc(190px + env(safe-area-inset-top, 0px)); padding: 6px 14px; border-radius: 16px; cursor: pointer; background: rgba(60, 14, 20, 0.85); color: #ffb0b8; border: 1px solid rgba(255,100,120,0.4); font-size: 12px; font-weight: 700; }
        .map-btn.alert { box-shadow: 0 0 0 2px #ff6b7a, 0 0 12px rgba(255,107,122,0.8); }
        .room-input { width: 100%; box-sizing: border-box; margin: 4px 0; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(100,180,255,0.3); background: rgba(10,14,22,0.9); color: #e8f2ff; font-size: 14px; }
        .room-peer { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 6px; border-radius: 10px; background: rgba(100,180,255,0.06); border: 1px solid rgba(100,180,255,0.15); font-size: 13px; color: #d8e8ff; }
        .room-peer .item-use-btn { margin-left: auto; }
        .tower-slot { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: #a8c8e8; }
        .tower-slot .item-use-btn { margin-left: auto; }
        .tower-mode .collection-card { outline: 1px dashed rgba(255,143,232,0.6); }
        .egg-info { flex: 1; min-width: 0; font-size: 12px; color: #a8c8e8; }
        .egg-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); margin-top: 5px; overflow: hidden; }
        .egg-bar > i { display: block; height: 100%; background: linear-gradient(90deg, #ffd166, #ff9f43); }
        .medal-tier { font-size: 11px; color: #ffd166; margin-left: 6px; }
        .fuse-slots { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 6px 0 10px; }
        .fuse-slot { width: 74px; height: 74px; border: 1px dashed rgba(255,209,102,0.45); border-radius: 14px; display: flex; align-items: center; justify-content: center; background: rgba(255,209,102,0.05); }
        .fuse-op { color: #ffd166; font-size: 20px; font-weight: 800; }
        .collection-card.equipped { border-color: #ffd166; box-shadow: 0 0 14px rgba(255, 209, 102, 0.4); }
        .dex-card { background: rgba(100,180,255,0.05); border: 1px solid rgba(100,180,255,0.12); border-radius: 12px; padding: 8px 4px; text-align: center; }
        .dex-card.unknown { opacity: 0.45; }
        .stop-marker { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; animation: gymFloat 3s ease-in-out infinite; }
        .stop-marker .stop-core {
            width: 36px; height: 36px; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #a0fff0, #19a8c8);
            border: 2px solid rgba(200, 255, 250, 0.9);
            box-shadow: 0 0 20px rgba(60, 220, 230, 0.7);
            display: flex; align-items: center; justify-content: center;
            color: #052a30; font-size: 16px; font-weight: 900;
        }
        .stop-marker.cooling { animation: none; filter: grayscale(1) brightness(0.7); }
        #env-badge {
            position: absolute; left: 14px; z-index: 800; pointer-events: none;
            top: calc(76px + env(safe-area-inset-top, 0px));
            background: rgba(10, 14, 20, 0.78); color: #9ab8d8;
            border: 1px solid rgba(100, 180, 255, 0.18); border-radius: 12px;
            padding: 3px 10px; font-size: 11px; font-weight: 600;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        body.night .leaflet-tile-pane { filter: brightness(0.45) saturate(0.5) contrast(1.15) hue-rotate(180deg) invert(0.05); }
        body.day .leaflet-tile-pane { filter: brightness(0.85) saturate(0.7) contrast(1.05) hue-rotate(180deg) invert(0.05); }
        .target-marker.boss { width: 76px; height: 76px; filter: drop-shadow(0 0 18px rgba(255, 90, 40, 0.95)); }
        .target-marker.boss .target-core {
            width: 54px; height: 54px;
            background: radial-gradient(circle at 35% 35%, #ffd27a, #c0201a);
            border-color: #fff0b0; box-shadow: 0 0 34px rgba(255, 90, 40, 0.9);
        }
        .target-marker.boss .target-core::after { content: '王'; font-size: 24px; }
        .target-marker.boss .target-distance { top: 70px; }
        .spr { display: inline-block; background-image: var(--atlas); background-repeat: no-repeat; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; flex-shrink: 0; }
        .avatar { overflow: hidden; }
        .avatar .spr { margin: 0; }
        .target-marker .target-core.has-spr {
            width: auto; height: auto; border: none; background: none; box-shadow: none;
            display: flex; align-items: center; justify-content: center;
            filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.65));
        }
        .target-marker .target-core.has-spr::after { display: none; }
        .target-marker, .target-marker.elite, .target-marker.boss { filter: none; }
        .target-marker.elite { filter: drop-shadow(0 0 10px rgba(190, 100, 255, 0.85)); }
        .target-marker.boss { filter: drop-shadow(0 0 14px rgba(255, 90, 40, 0.95)); }
        .target-marker .target-distance { top: 50px; }
        .target-marker.elite .target-distance { top: 60px; }
        .target-marker.boss .target-distance { top: 78px; }
        .target-badge {
            position: absolute; top: -4px; right: -6px; z-index: 2;
            min-width: 18px; height: 18px; padding: 0 3px; border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 900; color: #2a1200;
            background: linear-gradient(135deg, #ffe08a, #ffa940);
            border: 1px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 8px rgba(255, 190, 80, 0.8);
        }
        .player-marker { width: 56px; height: 56px; position: relative; display: block; }
        .player-marker .player-halo {
            position: absolute; left: 50%; top: 80%; width: 36px; height: 14px; margin-left: -18px;
            border-radius: 50%; background: rgba(60, 180, 255, 0.35);
            box-shadow: 0 0 14px rgba(60, 180, 255, 0.9);
            animation: playerPulse 2.5s ease-in-out infinite;
        }
        .player-marker .spr { position: absolute; left: 0; top: 0; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.6)); }
        .collection-emoji { display: flex; justify-content: center; }
        .gym-enemy-emoji { display: flex; align-items: center; justify-content: center; min-width: 64px; }
        .credits-box { font-size: 11px; line-height: 1.7; color: #9ab8d8; padding: 10px 4px; }
        .credits-box a { color: #7ec8ff; word-break: break-all; }
        .credits-box h4 { margin: 10px 0 4px; font-size: 12px; color: #ffd166; }
        .lang-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 10px 0 14px; }
        .lang-chip {
            padding: 6px 12px; border-radius: 14px; font-size: 12px; font-weight: 700; cursor: pointer;
            color: #9ab8d8; background: rgba(10, 14, 20, 0.6); border: 1px solid rgba(100, 180, 255, 0.28);
            -webkit-tap-highlight-color: transparent;
        }
        .lang-chip.active { color: #0a0e14; background: linear-gradient(135deg, #7ec8ff, #4a9eff); border-color: transparent; }
        #start-lang { margin-top: 18px; }
        .lang-gate-icon { font-size: 54px; margin-bottom: 10px; filter: drop-shadow(0 0 18px rgba(100, 200, 255, 0.5)); }
        .lang-gate-title { color: #9ab8d8; font-size: 14px; font-weight: 700; letter-spacing: 1px; margin-bottom: 22px; text-align: center; }
        .lang-gate-list { display: flex; flex-direction: column; gap: 12px; width: min(280px, 80vw); }
        .lang-big {
            padding: 15px 20px; border-radius: 28px; font-size: 18px; font-weight: 800; letter-spacing: 1px; cursor: pointer;
            color: #e8f4ff; background: rgba(20, 30, 48, 0.85); border: 1px solid rgba(100, 180, 255, 0.35);
            -webkit-tap-highlight-color: transparent; transition: transform 0.1s, background 0.15s;
        }
        .lang-big:active { transform: scale(0.97); background: linear-gradient(135deg, #7ec8ff, #4a9eff); color: #0a0e14; }
        .modal-tabs { overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
        .modal-tabs::-webkit-scrollbar { display: none; }
        .modal-tabs .modal-tab { flex: 1 1 0; min-width: 0; padding: 12px 2px; font-size: 11.5px; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .quest-done { border-color: rgba(255, 209, 102, 0.5); }
        .modal-tab { font-size: 12px; padding: 12px 4px; letter-spacing: 0; }
        .target-marker.hit { animation: targetHit 0.5s ease-out forwards; pointer-events: none; }
        @keyframes targetHit {
            0% { scale: 1; opacity: 1; }
            40% { scale: 1.3; opacity: 0.9; filter: brightness(2); }
            100% { scale: 0.2; opacity: 0; }
        }

        /* ============================================================ */
        /* 道場標記 */
        /* ============================================================ */
        .gym-marker {
            width: 54px; height: 54px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            animation: gymFloat 3s ease-in-out infinite;
        }
        .gym-marker .gym-core {
            width: 42px; height: 42px; border-radius: 12px;
            background: radial-gradient(circle at 35% 30%, #ffe08a, #d4a020);
            border: 2px solid rgba(255, 230, 180, 0.85);
            box-shadow: 0 0 24px rgba(255, 200, 60, 0.7), inset 0 0 12px rgba(255,255,255,0.3);
            display: flex; align-items: center; justify-content: center;
            color: #2a1a05; font-size: 20px; font-weight: 900;
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
            position: relative;
        }
        .gym-marker.owned .gym-core {
            background: radial-gradient(circle at 35% 30%, #7ec8ff, #2a6fd8);
            border-color: rgba(180, 220, 255, 0.9);
            box-shadow: 0 0 24px rgba(100, 180, 255, 0.8), inset 0 0 12px rgba(255,255,255,0.4);
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
        }
        .gym-marker::before {
            content: '';
            position: absolute; inset: -6px;
            border-radius: 50%;
            border: 2px solid rgba(255, 200, 60, 0.35);
            animation: ringPulse 2.4s ease-out infinite;
            pointer-events: none;
        }
        .gym-marker.owned::before { border-color: rgba(100, 180, 255, 0.4); }
        @keyframes gymFloat { 0%, 100% { translate: 0 0; } 50% { translate: 0 -4px; } }

        /* ========== 玩家標記 ========== */
        .player-marker {
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
        }
        .player-marker .player-dot {
            width: 18px; height: 18px; border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #7ee8ff, #1a8aff);
            border: 2px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 16px rgba(60, 180, 255, 0.8), 0 0 40px rgba(60, 180, 255, 0.3);
            animation: playerPulse 2.5s ease-in-out infinite;
        }
        @keyframes playerPulse {
            0%, 100% { box-shadow: 0 0 16px rgba(60, 180, 255, 0.8), 0 0 40px rgba(60, 180, 255, 0.3); }
            50% { box-shadow: 0 0 24px rgba(60, 180, 255, 1), 0 0 60px rgba(60, 180, 255, 0.5); }
        }

        /* ============================================================ */
        /* 通用模態框 */
        /* ============================================================ */
        .game-modal {
            position: fixed; inset: 0; z-index: 1500;
            background: rgba(5, 8, 14, 0.82);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            transition: opacity 0.3s;
        }
        .game-modal.hidden { opacity: 0; pointer-events: none; }
        .modal-content {
            width: 100%; max-width: 420px;
            max-height: 82vh;
            background: linear-gradient(160deg, rgba(18, 24, 38, 0.98) 0%, rgba(10, 14, 22, 0.99) 100%);
            border: 1px solid rgba(100, 180, 255, 0.25);
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(60, 160, 255, 0.12);
            display: flex; flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .modal-header {
            padding: 16px 20px;
            font-size: 16px; font-weight: 800; letter-spacing: 2px;
            color: #e8f4ff;
            border-bottom: 1px solid rgba(100, 180, 255, 0.12);
            display: flex; justify-content: space-between; align-items: center;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.3);
        }
        .modal-close {
            background: transparent; border: none; color: #6a8aaf;
            font-size: 24px; cursor: pointer; line-height: 1; padding: 0 4px;
            -webkit-tap-highlight-color: transparent;
        }
        .modal-close:active { color: #ff6b7a; }
        .modal-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(100, 180, 255, 0.1);
        }
        .modal-tab {
            flex: 1; padding: 12px 8px;
            background: transparent; border: none;
            color: #6a8aaf; font-size: 13px; font-weight: 700;
            letter-spacing: 1px; cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .modal-tab.active {
            color: #7ec8ff;
            border-bottom-color: #7ec8ff;
            background: rgba(100, 180, 255, 0.06);
        }
        .modal-body {
            flex: 1; overflow-y: auto; padding: 16px;
            scrollbar-width: thin; scrollbar-color: rgba(100, 180, 255, 0.3) transparent;
        }
        .modal-body::-webkit-scrollbar { width: 6px; }
        .modal-body::-webkit-scrollbar-thumb { background: rgba(100, 180, 255, 0.3); border-radius: 3px; }
        .tab-panel { animation: panelFade 0.25s ease-out; }
        .tab-panel.hidden { display: none; }
        @keyframes panelFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* 物品卡片 */
        .item-card {
            display: flex; align-items: center; gap: 12px;
            padding: 12px; border-radius: 12px;
            background: rgba(100, 180, 255, 0.06);
            border: 1px solid rgba(100, 180, 255, 0.14);
            margin-bottom: 10px;
        }
        .item-icon {
            width: 48px; height: 48px; border-radius: 10px;
            background: radial-gradient(circle at 40% 35%, #2a3a55, #0f1520);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; flex-shrink: 0;
            border: 1px solid rgba(100, 180, 255, 0.2);
        }
        .item-info { flex: 1; min-width: 0; }
        .item-name {
            font-size: 14px; font-weight: 700; color: #e8f4ff;
            margin-bottom: 2px;
        }
        .item-desc {
            font-size: 11px; color: #6a8aaf; line-height: 1.4;
        }
        .item-count {
            font-size: 15px; font-weight: 800; color: #ffd166;
            font-variant-numeric: tabular-nums;
            padding: 0 6px;
        }
        .item-use-btn {
            padding: 8px 14px; border-radius: 10px;
            background: linear-gradient(135deg, #7ec8ff, #4a9eff);
            color: #0a0e14; font-size: 12px; font-weight: 800;
            letter-spacing: 1px; border: none; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s;
        }
        .item-use-btn:active { transform: scale(0.94); }
        .item-use-btn:disabled {
            opacity: 0.35; pointer-events: none;
            background: #3a4a5a; color: #6a8aaf;
        }

        /* 練妖壺 */
        .kiln-wrap {
            display: flex; flex-direction: column; align-items: center;
            gap: 14px; padding: 20px 12px;
            text-align: center;
        }
        .kiln-emoji {
            font-size: 72px; line-height: 1;
            filter: drop-shadow(0 0 24px rgba(255, 180, 80, 0.5));
            animation: kilnFloat 2.4s ease-in-out infinite;
        }
        @keyframes kilnFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .kiln-desc { font-size: 14px; color: #c8e0ff; font-weight: 600; letter-spacing: 0.5px; }
        .kiln-hint { font-size: 12px; color: #6a8aaf; line-height: 1.6; }
        .kiln-progress {
            width: 100%; max-width: 240px; height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px; overflow: hidden;
            margin-top: 6px;
        }
        .kiln-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd166, #ff9a3c);
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(255, 180, 60, 0.7);
            transition: width 0.5s linear;
        }
        .btn-modal-action {
            padding: 12px 32px; border-radius: 24px;
            background: linear-gradient(135deg, #ffd166, #ff9a3c);
            color: #1a1005; font-size: 14px; font-weight: 800;
            letter-spacing: 2px; border: none; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 0 20px rgba(255, 180, 60, 0.4);
            transition: transform 0.12s;
        }
        .btn-modal-action:active { transform: scale(0.94); }
        .btn-modal-action:disabled {
            opacity: 0.35; pointer-events: none;
            background: #3a4a5a; color: #6a8aaf; box-shadow: none;
        }

        /* 妖怪圖鑑 */
        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }
        .collection-card {
            background: rgba(100, 180, 255, 0.06);
            border: 1px solid rgba(100, 180, 255, 0.15);
            border-radius: 12px;
            padding: 10px 6px; text-align: center;
        }
        .collection-emoji {
            font-size: 30px; line-height: 1;
            filter: drop-shadow(0 0 8px rgba(255, 80, 80, 0.4));
        }
        .collection-name {
            font-size: 11px; color: #a8c8e8;
            margin-top: 6px; font-weight: 600;
        }
        .collection-empty {
            padding: 32px 12px; text-align: center;
            color: #4a6a8a; font-size: 13px; line-height: 1.8;
        }

        /* 道場模態框 */
        .gym-info-wrap {
            padding: 20px; text-align: center;
        }
        .gym-name-title {
            font-size: 22px; font-weight: 900; color: #ffd166;
            letter-spacing: 4px;
            text-shadow: 0 0 24px rgba(255, 200, 60, 0.5);
            margin-bottom: 6px;
        }
        .gym-status {
            display: inline-block;
            font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
            padding: 3px 12px; border-radius: 12px;
            background: rgba(255, 200, 60, 0.15);
            color: #ffd166;
            border: 1px solid rgba(255, 200, 60, 0.3);
            margin-bottom: 16px;
        }
        .gym-status.owned {
            background: rgba(100, 180, 255, 0.15);
            color: #7ec8ff;
            border-color: rgba(100, 180, 255, 0.35);
        }
        .gym-enemy-display {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            padding: 16px; margin-bottom: 16px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            border: 1px solid rgba(255, 100, 100, 0.15);
        }
        .gym-enemy-emoji { font-size: 44px; filter: drop-shadow(0 0 16px rgba(255, 80, 80, 0.6)); }
        .gym-enemy-text { text-align: left; }
        .gym-enemy-label { font-size: 10px; color: #6a8aaf; letter-spacing: 1.5px; }
        .gym-enemy-name { font-size: 16px; font-weight: 800; color: #ff9a9a; }
        .gym-rewards {
            font-size: 12px; color: #9ab8d8; line-height: 1.8;
            padding: 12px; background: rgba(100, 180, 255, 0.05);
            border-radius: 10px; margin-bottom: 18px;
        }
        .gym-rewards strong { color: #ffd166; }

        /* Toast */
        #toast-container {
            position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
            z-index: 2000; display: flex; flex-direction: column; gap: 8px;
            pointer-events: none; align-items: center;
            padding-top: env(safe-area-inset-top, 0px);
        }
        .toast {
            background: rgba(10, 14, 20, 0.92);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 180, 255, 0.3);
            border-radius: 24px;
            padding: 10px 22px;
            color: #e8f4ff;
            font-size: 13px; font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 20px rgba(100, 180, 255, 0.2);
            animation: toastIn 0.3s ease-out;
            transition: opacity 0.3s, transform 0.3s;
        }
        .toast.hide { opacity: 0; transform: translateY(-10px); }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================ */
        /* AR 戰鬥 */
        /* ============================================================ */
        .battle-overlay {
            position: fixed; inset: 0; z-index: 1100;
            background: #05050a; opacity: 1;
            transition: opacity 0.4s; overflow: hidden;
        }
        .battle-overlay.hidden { opacity: 0; pointer-events: none; }
        #ar-video {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 0; background: #05050a;
        }
        #ar-fallback {
            position: absolute; inset: 0; z-index: 0;
            background: radial-gradient(ellipse at 50% 40%, rgba(40, 22, 60, 0.9) 0%, rgba(5, 5, 15, 1) 70%), #05050a;
            display: flex; align-items: center; justify-content: center;
        }
        #ar-fallback::before {
            content: ''; position: absolute; inset: 0;
            background-image:
                radial-gradient(1px 1px at 10% 20%, rgba(200,220,255,0.55) 50%, transparent 50%),
                radial-gradient(1px 1px at 80% 30%, rgba(200,220,255,0.45) 50%, transparent 50%),
                radial-gradient(1.5px 1.5px at 40% 70%, rgba(200,220,255,0.5) 50%, transparent 50%),
                radial-gradient(1px 1px at 65% 12%, rgba(200,220,255,0.35) 50%, transparent 50%),
                radial-gradient(1px 1px at 25% 85%, rgba(200,220,255,0.45) 50%, transparent 50%),
                radial-gradient(1.5px 1.5px at 90% 75%, rgba(200,220,255,0.4) 50%, transparent 50%);
            animation: starDrift 60s linear infinite;
        }
        @keyframes starDrift { from { transform: translateY(0); } to { transform: translateY(-40px); } }
        #ar-fallback .fallback-label {
            position: relative; z-index: 1;
            color: #7a9abb; font-size: 13px; letter-spacing: 2px;
            text-align: center; line-height: 1.8; padding: 0 24px;
        }
        #ar-fallback.hidden { display: none; }
        #ar-video.off { display: none; }
        #btn-ar-toggle {
            position: absolute; right: 14px; z-index: 4;
            top: calc(150px + env(safe-area-inset-top, 0px));
            padding: 6px 14px; border-radius: 16px; cursor: pointer;
            background: rgba(8, 10, 18, 0.82); color: #9ab8d8;
            border: 1px solid rgba(100, 180, 255, 0.3);
            font-size: 12px; font-weight: 700; letter-spacing: 1px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        #btn-ar-toggle.on { color: #0a0e14; background: linear-gradient(135deg, #7ec8ff, #4a9eff); border-color: transparent; }
        #battle-canvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
            z-index: 1; touch-action: none; display: block;
        }
        #hit-flash {
            position: absolute; inset: 0; z-index: 2; pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(255, 40, 60, 0) 40%, rgba(255, 30, 50, 0.55) 100%);
            opacity: 0; transition: opacity 0.4s;
        }
        #hit-flash.active { opacity: 1; transition: opacity 0.06s; }

        .battle-top {
            position: absolute; top: 0; left: 0; right: 0; z-index: 3;
            display: flex; flex-direction: column; gap: 8px;
            padding: 12px 16px;
            padding-top: calc(12px + env(safe-area-inset-top, 0px));
            pointer-events: none;
        }
        .battle-bar {
            background: rgba(8, 10, 18, 0.82);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 180, 255, 0.22);
            border-radius: 12px; padding: 8px 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .battle-bar .bp-label {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px;
        }
        .battle-bar.player .bp-label { color: #7ec8ff; }
        .battle-bar.enemy  .bp-label { color: #ff9a9a; }
        .battle-bar .bp-num {
            font-size: 11px; color: #a8c8e8; font-variant-numeric: tabular-nums; font-weight: 600;
        }
        .battle-bar.enemy .bp-num { color: #d8a8a8; }
        .bp-hp-bar { height: 8px; background: rgba(255, 255, 255, 0.08); border-radius: 4px; overflow: hidden; }
        .bp-hp-fill { height: 100%; width: 100%; border-radius: 4px; transition: width 0.3s ease-out; }
        .player .bp-hp-fill {
            background: linear-gradient(90deg, #7ec8ff, #4a9eff);
            box-shadow: 0 0 12px rgba(126, 200, 255, 0.7);
        }
        .enemy .bp-hp-fill {
            background: linear-gradient(90deg, #ff6b7a, #cc2244);
            box-shadow: 0 0 12px rgba(255, 60, 80, 0.8);
        }

        .battle-bottom {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 3;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            padding: 12px 16px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            pointer-events: none;
        }
        .battle-log {
            width: 100%; max-width: 420px; height: 54px;
            overflow-y: auto; display: flex; flex-direction: column;
            justify-content: flex-end; gap: 2px;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(100, 180, 255, 0.12);
            border-radius: 10px; font-size: 11.5px; color: #9ab8d8;
            scrollbar-width: none;
        }
        .battle-log::-webkit-scrollbar { display: none; }
        .battle-log-line {
            animation: logFadeIn 0.25s ease-out;
            line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        @keyframes logFadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .battle-hint {
            color: #c8e0ff; font-size: 13px; font-weight: 600; letter-spacing: 1.5px;
            text-shadow: 0 0 16px rgba(60, 160, 255, 0.7), 0 2px 6px rgba(0,0,0,0.9);
            padding: 6px 18px; border-radius: 20px;
            background: rgba(8, 12, 20, 0.55);
            border: 1px solid rgba(100, 180, 255, 0.18);
            animation: hintPulse 2.2s ease-in-out infinite;
        }
        @keyframes hintPulse { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } }

        /* ========== 遮罩 ========== */
        .overlay {
            position: absolute; inset: 0; z-index: 1200;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at center, rgba(10, 14, 22, 0.85) 0%, rgba(6, 8, 14, 0.97) 100%);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: opacity 0.5s; padding: 24px;
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }
        .overlay h1 {
            font-size: clamp(28px, 7vw, 44px); font-weight: 900;
            color: #e8f4ff; letter-spacing: 6px;
            text-shadow: 0 0 30px rgba(100, 200, 255, 0.4); margin-bottom: 8px;
        }
        .overlay h1 span { color: #ffd166; }
        .overlay p {
            color: #7a9abb; font-size: 15px; margin-bottom: 32px;
            text-align: center; line-height: 1.9; max-width: 350px;
        }
        .overlay p em { color: #7ec8ff; font-style: normal; font-weight: 600; }
        .btn-start {
            pointer-events: auto;
            padding: 16px 56px;
            font-size: 18px; font-weight: 700; letter-spacing: 4px;
            color: #0a0e14;
            background: linear-gradient(135deg, #7ec8ff, #4a9eff);
            border: none; border-radius: 60px; cursor: pointer;
            box-shadow: 0 0 30px rgba(60, 160, 255, 0.5), 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s, box-shadow 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-start:active { transform: scale(0.96); }
        .btn-start:disabled { opacity: 0.4; pointer-events: none; }

        #gameover-overlay h1 { color: #ff6b7a; text-shadow: 0 0 30px rgba(255, 60, 80, 0.4); }
        .stats-row { display: flex; gap: 40px; margin-bottom: 32px; }
        .stat-item { text-align: center; }
        .stat-item .stat-num {
            font-size: 36px; font-weight: 900; color: #ffd166;
            font-variant-numeric: tabular-nums;
        }
        .stat-item .stat-label {
            font-size: 12px; color: #6a8aaf;
            letter-spacing: 2px; text-transform: uppercase; margin-top: 4px;
        }

        /* ========== 響應式 ========== */
        @media (max-width: 480px) {
            .avatar { width: 38px; height: 38px; font-size: 18px; }
            .player-info { min-width: 96px; padding: 5px 10px; }
            .player-name { font-size: 11px; }
            .badge { padding: 5px 10px; }
            .badge .value { font-size: 15px; }
            .badge-label { font-size: 9px; }
            .badge-btn { width: 42px; height: 42px; font-size: 18px; }
            .map-btn { width: 40px; height: 40px; font-size: 16px; }
            #radar-panel { width: min(200px, 58vw); }
            .radar-list { max-height: 104px; }
            .battle-log { height: 46px; font-size: 10.5px; }
            .battle-hint { font-size: 12px; letter-spacing: 1px; }
            .modal-content { max-width: 100%; }
            .item-icon { width: 40px; height: 40px; font-size: 20px; }
            .kiln-emoji { font-size: 60px; }
        }
        @media (max-height: 640px) {
            .battle-log { height: 40px; }
            .radar-list { max-height: 84px; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- 玩家 HUD -->
    <div id="player-hud">
        <div class="avatar"></div>
        <div class="player-info">
            <div class="player-name-row">
                <span class="player-name">御劍者</span>
                <span class="player-level">Lv.<span id="player-level">1</span></span>
            </div>
            <div class="exp-bar">
                <div class="exp-fill" id="exp-fill"></div>
            </div>
        </div>
    </div>

    <div id="env-badge">--</div>

    <!-- 右上徽章 -->
    <div id="top-badges">
        <div class="badge" id="score-panel">
            <span class="badge-label">斬妖</span>
            <span class="value" id="score-value">0</span>
        </div>
        <div class="badge" id="hp-panel">
            <span class="badge-label">劍氣</span>
            <span class="value" id="hp-value">5</span>
        </div>
        <button class="badge-btn" id="btn-inventory" aria-label="物品欄">
            🎒
            <span id="inv-badge">0</span>
        </button>
    </div>

    <!-- 地圖控制元件 -->
    <div id="map-controls">
        <button class="map-btn compass-btn" id="btn-compass" aria-label="指南針">
            <span class="compass-arrow" id="compass-arrow">▲</span>
        </button>
        <button class="map-btn" id="btn-locate" aria-label="回到當前位置">📍</button>
        <button class="map-btn" id="btn-room" aria-label="房間">🤝</button>
        <button class="map-btn" id="btn-zoom-in" aria-label="放大">+</button>
        <button class="map-btn" id="btn-zoom-out" aria-label="縮小">−</button>
    </div>

    <!-- 雷達 -->
    <div id="radar-panel">
        <div class="radar-header" id="radar-header">
            <span>附近妖邪 <span class="radar-count" id="radar-count">0</span></span>
            <span class="radar-toggle" id="radar-toggle">▼</span>
        </div>
        <div class="radar-list" id="radar-list">
            <div class="radar-empty">附近暫無妖邪</div>
        </div>
    </div>

    <!-- 底部狀態 -->
    <div id="status-bar">
        <div id="status-text">正在獲取位置…</div>
    </div>

    <!-- Toast 容器 -->
    <div id="toast-container"></div>

    <!-- ============================================================ -->
    <!-- AR 戰鬥 -->
    <!-- ============================================================ -->
    <div id="battle-overlay" class="battle-overlay hidden">

                return `<span class="spr" style="width:${o.px}px;height:${o.px}px;background-size:${ATLAS_W * scale}px ${ATLAS_H * scale}px;background-position:${-ox * scale}px ${-oy * scale}px"></span>`;

            function useFallbackLocation(onReady, reason) {
                state.usingFallback = true;
                state.playerLatLng = L.latLng(FALLBACK_LAT, FALLBACK_LNG);
                initMap(FALLBACK_LAT, FALLBACK_LNG);
                statusEl.textContent = reason + ' 已切換至預設位置（北京）。';
                onReady(true);

            function startGeolocation(onReady) {
                if (!navigator.geolocation) {
                    useFallbackLocation(onReady, '您的瀏覽器不支援地理定位，');
                    return;
                }
                const options = { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 };

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        state.usingFallback = false;
                        state.playerLatLng = L.latLng(pos.coords.latitude, pos.coords.longitude);
                        initMap(pos.coords.latitude, pos.coords.longitude);
                        onReady(false);

                        state.watchId = navigator.geolocation.watchPosition(
                            (p) => {
                                const newLatLng = L.latLng(p.coords.latitude, p.coords.longitude);
                                if (state.playerLatLng && !state.usingFallback) {
                                    const dd = state.playerLatLng.distanceTo(newLatLng);
                                    if (dd >= 3 && dd < 150) {
                                        const before = Math.floor(state.walked / 500);
                                        state.walked += dd;
                                        addEggProgress(dd);
                                        state.buddyAcc = (state.buddyAcc || 0) + dd;
                                        while (state.buddyAcc >= 300) { state.buddyAcc -= 300; companionGainExp(); }
                                        if (Math.floor(state.walked / 500) > before) {
                                            state.stones += 5;
                                            addToast('步行達 ' + (Math.floor(state.walked / 500) * 0.5).toFixed(1) + ' km，靈石 +5');
                                            updateHUD();
                                        }
                                    }
                                }
                                state.playerLatLng = newLatLng;
                                if (state.playerMarker) state.playerMarker.setLatLng(newLatLng);
                                if (state.playerCircle) state.playerCircle.setLatLng(newLatLng);
                                if (state.map && state.running && !battle.active) {
                                    state.map.panTo(newLatLng, { animate: true, duration: 0.5 });
                                }
                            },
                            (err) => console.warn('watchPosition:', err.message),
                            { enableHighAccuracy: true, maximumAge: 5000 }
                        );
                    },
                    (err) => {
                        let msg = '定位失敗：';
                        if (err.code === 1) msg += '請允許定位許可權。';
                        else if (err.code === 2) msg += '位置資訊不可用。';
                        else msg += '定位超時。';
                        useFallbackLocation(onReady, msg);
                    },
                    options
                );
            }

            // ============================================================
            // 妖怪生成
            // ============================================================
            function pickRandomTargetLatLng() {
                if (!state.map || !state.playerLatLng) return null;
                const size = state.map.getSize();
                if (size.x < 50 || size.y < 50) return null;   // 地圖尺寸未就緒，交給兜底邏輯

                const center = state.map.getCenter();
                const bounds = state.map.getBounds();
                const halfW = center.distanceTo(L.latLng(center.lat, bounds.getEast()));
                const halfH = center.distanceTo(L.latLng(bounds.getNorth(), center.lng));
                const maxR = Math.max(CONFIG.minPlayerDist + 30, Math.min(halfW, halfH) * 0.92);
                const minR = Math.min(maxR - 20, Math.max(CONFIG.minPlayerDist, maxR * 0.3));

                // 把圓分成 8 個扇區，優先選妖邪最少的扇區，避免扎堆
                const SECT = 8;
                const counts = new Array(SECT).fill(0);
                const lat0 = state.playerLatLng.lat, lng0 = state.playerLatLng.lng;
                for (const t of state.targets) {
                    let ang = Math.atan2(t.latlng.lng - lng0, t.latlng.lat - lat0);
                    if (ang < 0) ang += Math.PI * 2;
                    counts[Math.min(SECT - 1, Math.floor(ang / (Math.PI * 2) * SECT))]++;
                }
                const minCount = Math.min.apply(null, counts);
                const sectors = [];
                counts.forEach((c, i) => { if (c === minCount) sectors.push(i); });

                const latPerMeter = 1 / 111320;
                const lngPerMeter = 1 / (111320 * Math.cos(lat0 * Math.PI / 180));

                for (let attempt = 0; attempt < 40; attempt++) {
                    // 前 25 次限制在最空的扇區，之後放寬到任意方向
                    const sec = attempt < 25 ? sectors[Math.floor(Math.random() * sectors.length)]
                                              : Math.floor(Math.random() * SECT);
                    const angle = (sec + Math.random()) / SECT * Math.PI * 2;
                    const dist = minR + Math.sqrt(Math.random()) * (maxR - minR);
                    const lat = lat0 + Math.cos(angle) * dist * latPerMeter;
                    const lng = lng0 + Math.sin(angle) * dist * lngPerMeter;
                    const candidate = L.latLng(lat, lng);

                    // 不能壓在 HUD / 雷達 / 按鈕上
                    const pt = state.map.latLngToContainerPoint(candidate);
                    if (pt.x < 40 || pt.x > size.x - 70) continue;
                    if (pt.y < 100 || pt.y > size.y - 130) continue;
                    if (pt.x < 250 && pt.y > size.y - 260) continue;   // 雷達面板區域

                    let tooClose = false;
                    for (const t of state.targets) {
                        if (t.latlng.distanceTo(candidate) < CONFIG.minTargetDist) { tooClose = true; break; }
                    }
                    if (tooClose) continue;
                    return candidate;
                }
                return null;
            }

            function pickFallbackLatLng() {
                if (!state.playerLatLng) return null;
                const angle = Math.random() * Math.PI * 2;
                const distMeters = 80 + Math.random() * 400;
                const latPerMeter = 1 / 111320;
                const lngPerMeter = 1 / (111320 * Math.cos(state.playerLatLng.lat * Math.PI / 180));
                const lat = state.playerLatLng.lat + Math.cos(angle) * distMeters * latPerMeter;
                const lng = state.playerLatLng.lng + Math.sin(angle) * distMeters * lngPerMeter;
                return L.latLng(lat, lng);
            }

            function spawnTarget(opts) {
                if (!state.running || !state.playerLatLng) return;
                if (battle.active || !state.map) return;

                let latlng = pickRandomTargetLatLng() || pickFallbackLatLng();
                if (!latlng) return;

                const id = ++state.targetIdSeq;
                const isBoss = !!(opts && opts.boss);
                const isElite = isBoss || Math.random() < eliteChance();
                const enemyIdx = Math.floor(Math.random() * ENEMIES.length);
                const isShiny = !isBoss && Math.random() < CONFIG.shinyChance;
                const sprPx = isBoss ? 84 : (isElite ? 66 : 52);
                const badge = isBoss ? '<div class="target-badge">王</div>' : (isShiny ? '<div class="target-badge">✦</div>' : (isElite ? '<div class="target-badge">精</div>' : ''));
                const icon = L.divIcon({
                    className: 'target-marker' + (isElite ? ' elite' : '') + (isBoss ? ' boss' : '') + (isShiny ? ' shiny' : ''),
                    html: `<div class="target-ring"></div><div class="target-core has-spr">${spr(ENEMIES[enemyIdx].name, { px: sprPx })}</div>${badge}<div class="target-distance">--m</div>`,
                    iconSize: [48, 48], iconAnchor: [24, 24]
                });
                const marker = L.marker(latlng, { icon, interactive: true, zIndexOffset: 500 }).addTo(state.map);

                marker.on('click', () => {
                    if (battle.active || !state.running) return;
                    enterBattle(id, 'normal');
                });

                marker.on('add', () => {
                    const el = marker.getElement();
                    if (el && state.playerLatLng) {
                        const d = Math.round(state.playerLatLng.distanceTo(latlng));
                        const distEl = el.querySelector('.target-distance');
                        if (distEl) distEl.textContent = d + 'm';
                    }
                });

                const targetObj = { id, latlng, marker, timeoutId: null, elite: isElite, boss: isBoss, shiny: isShiny, enemyIdx };
                if (isShiny) addToast('✦ 發現閃光妖！');
                targetObj.timeoutId = setTimeout(() => {
                    if (!state.targets.find(t => t.id === id)) return;
                    if (battle.active) { targetObj.timeoutId = null; return; }
                    removeTarget(id, false);
                    if (state.running) {
                        statusEl.textContent = '一隻妖邪遁走了，新的妖邪出現…';
                        setTimeout(() => { if (state.running && !battle.active) spawnTarget(); }, 800);
                    }
                }, targetObj.boss ? 180000 : CONFIG.targetDespawnTime);

                state.targets.push(targetObj);
                updateRadar();
            }

            function removeTarget(id, hit) {
                const idx = state.targets.findIndex(t => t.id === id);
                if (idx === -1) return;
                const t = state.targets[idx];
                clearTimeout(t.timeoutId);
                if (hit) {
                    t.marker.getElement()?.classList.add('hit');
                    setTimeout(() => { if (state.map) state.map.removeLayer(t.marker); }, 500);
                } else {
                    state.map.removeLayer(t.marker);
                }
                state.targets.splice(idx, 1);
                updateRadar();
            }

            function resumeTargetTimeouts() {
                for (const t of state.targets) {
                    if (t.timeoutId) continue;
                    t.timeoutId = setTimeout(() => {
                        if (!state.targets.find(x => x.id === t.id)) return;
                        if (battle.active) { t.timeoutId = null; return; }
                        removeTarget(t.id, false);
                        if (state.running) {

                            setTimeout(() => { if (state.running && !battle.active) spawnTarget(); }, 800);
                        }
                    }, t.boss ? 180000 : CONFIG.targetDespawnTime);
                }
            }

            // ============================================================
            // 道場
            // ============================================================
            function makeGymIcon(owned) {
                return L.divIcon({
                    className: 'gym-marker' + (owned ? ' owned' : ''),
                    html: '<div class="gym-core">道</div>',
                    iconSize: [54, 54], iconAnchor: [27, 27]
                });
            }

            function spawnGyms() {
                for (const g of state.gyms) {
                    if (state.map) state.map.removeLayer(g.marker);
                }
                state.gyms = [];

                if (!state.playerLatLng) return;

                for (let i = 0; i < CONFIG.gymCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const distMeters = CONFIG.gymMinDist + Math.random() * (CONFIG.gymMaxDist - CONFIG.gymMinDist);
                    const latPerMeter = 1 / 111320;
                    const lngPerMeter = 1 / (111320 * Math.cos(state.playerLatLng.lat * Math.PI / 180));
                    const lat = state.playerLatLng.lat + Math.cos(angle) * distMeters * latPerMeter;
                    const lng = state.playerLatLng.lng + Math.sin(angle) * distMeters * lngPerMeter;
                    const latlng = L.latLng(lat, lng);

                    createGym(latlng, i);
                }
            }

            function createGym(latlng, index, data) {
                const id = ++state.gymIdSeq;
                const template = ENEMIES[Math.floor(Math.random() * ENEMIES.length)];
                data = data || {};
                const name = data.name || GYM_NAMES[index % GYM_NAMES.length];
                const owned = !!data.owned;

                const marker = L.marker(latlng, {
                    icon: makeGymIcon(owned), interactive: true, zIndexOffset: 400
                }).addTo(state.map);

                marker.on('click', () => {
                    if (battle.active || !state.running) return;
                    openGymModal(id);
                });

                state.gyms.push({
                    id, latlng, marker, name,
                    enemyName: data.enemyName || template.name,
                    enemyEmoji: data.enemyEmoji || template.emoji,
                    owned,
                    cooldownUntil: data.cooldownUntil || 0,
                    lastClaim: data.lastClaim || 0
                });
            }

            function openGymModal(gymId) {
                const gym = state.gyms.find(g => g.id === gymId);
                if (!gym) return;
                currentGymId = gymId;

                document.getElementById('gym-name').textContent = gym.name;
                document.getElementById('gym-emoji').innerHTML = sprFor(gym.enemyEmoji, { px: 72 });
                document.getElementById('gym-enemy-name').textContent = gym.enemyName;

                const statusEl2 = document.getElementById('gym-status');
                const btn = document.getElementById('btn-gym-challenge');

            // ============================================================
            // 物品欄
            // ============================================================
            function updateInventoryBadge() {
                const total = state.inventory.swordCharm + state.inventory.qiPill + state.inventory.demonCore + (state.inventory.incense || 0);
                if (total > 0) {
                    invBadgeEl.textContent = total > 99 ? '99+' : total;

            function renderInventory() {
                const el = document.getElementById('tab-items');
                const inv = state.inventory;
                el.innerHTML = Object.keys(ITEM_DEFS).map(key => {
                    const def = ITEM_DEFS[key];
                    const count = inv[key];
                    let btnHtml = '';
                    if (key === 'qiPill') {
                        btnHtml = `<button class="item-use-btn" data-item="qiPill" ${count > 0 && state.hp < CONFIG.maxHp ? '' : 'disabled'}>使用</button>`;
                    } else if (key === 'swordCharm') {
                        btnHtml = `<span style="font-size:11px; color:#6a8aaf; padding:0 6px;">自動</span>`;
                    } else if (key === 'incense') {
                        btnHtml = `<button class="item-use-btn" data-item="incense" ${count > 0 ? '' : 'disabled'}>點燃</button>`;
                    } else if (key === 'demonCore') {
                        btnHtml = `<span style="font-size:11px; color:#6a8aaf; padding:0 6px;">孵化</span>`;

                                <div class="item-desc">${def.desc}</div>
                            </div>
                            <div class="item-count">${count}</div>
                            ${btnHtml}
                        </div>
                    `;
                }).join('');
            }

            function useItem(type) {
                if (type === 'incense') {
                    if (state.inventory.incense <= 0 || battle.active || !state.running) return;
                    state.inventory.incense--;
                    for (let i = 0; i < 4; i++) setTimeout(() => { if (state.running && !battle.active) spawnTarget(); }, i * 350);
                    updateInventoryBadge();
                    renderInventory();
                    addToast('引妖香點燃，妖邪被吸引而來！');
                    return;
                }
                if (type === 'qiPill') {
                    if (state.inventory.qiPill <= 0) return;
                    if (state.hp >= CONFIG.maxHp) { addToast('劍氣已滿'); return; }
                    state.inventory.qiPill--;
                    state.hp = Math.min(CONFIG.maxHp, state.hp + 1);
                    updateHUD();
                    updateInventoryBadge();
                    renderInventory();
                    addToast('使用回氣丹，劍氣 +1');
                }
            }

            // ============================================================
            // 練妖壺
            // ============================================================
            function renderKiln() { renderKilnBase(); const el = document.getElementById('tab-kiln'); if (el) el.insertAdjacentHTML('beforeend', eggsHtml()); }
            function renderKilnBase() {
                const el = document.getElementById('tab-kiln');
                if (state.kiln.active) {
                    const elapsed = Date.now() - state.kiln.startTime;
                    const remain = Math.max(0, CONFIG.kilnDuration - elapsed);
                    if (remain === 0) {
                        el.innerHTML = `
                            <div class="kiln-wrap">
                                <div class="kiln-emoji">🥚</div>
                                <div class="kiln-desc">孵化完成！</div>
                                <div class="kiln-hint">${sprFor(state.kiln.pendingEmoji, { px: 36 })}<br>${state.kiln.pendingName} 已成形</div>
                                <button class="btn-modal-action" id="btn-kiln-claim">領取妖怪</button>
                            </div>
                        `;
                    } else {
                        const sec = Math.ceil(remain / 1000);
                        const pct = (elapsed / CONFIG.kilnDuration) * 100;
                        el.innerHTML = `
                            <div class="kiln-wrap">
                                <div class="kiln-emoji">🔥</div>
                                <div class="kiln-desc">孵化中… 剩餘 ${sec} 秒</div>
                                <div class="kiln-progress"><div class="kiln-progress-fill" style="width:${pct}%"></div></div>
                                <div class="kiln-hint">${sprFor(state.kiln.pendingEmoji, { px: 36 })}<br>正在妖氣中成形…</div>
                            </div>
                        `;
                    }
                } else {
                    const canStart = state.inventory.demonCore >= CONFIG.kilnCost;
                    el.innerHTML = `
                        <div class="kiln-wrap">
                            <div class="kiln-emoji">🏺</div>
                            <div class="kiln-desc">練妖壺</div>
                            <div class="kiln-hint">放入 ${CONFIG.kilnCost} 顆妖丹，<br>可孵化出一隻稀有妖怪。</div>
                            <div class="kiln-hint" style="color:#ffd166; font-weight:700;">當前妖丹：${state.inventory.demonCore} 顆</div>
                            <button class="btn-modal-action" id="btn-kiln-start" ${canStart ? '' : 'disabled'}>啟動孵化</button>
                        </div>
                    `;
                }
            }

            function startKiln() {
                if (state.kiln.active) return;
                if (state.inventory.demonCore < CONFIG.kilnCost) return;
                state.inventory.demonCore -= CONFIG.kilnCost;
                state.kiln.active = true;
                state.kiln.startTime = Date.now();
                const template = ENEMIES[Math.floor(Math.random() * ENEMIES.length)];
                state.kiln.pendingEmoji = template.emoji;
                state.kiln.pendingName = template.name;
                updateInventoryBadge();
                renderInventory();
                renderKiln();
                addToast('練妖壺啟動，30 秒後孵化');
                if (kilnTimer) clearInterval(kilnTimer);
                kilnTimer = setInterval(() => {
                    if (!inventoryModal.classList.contains('hidden') &&
                        !document.getElementById('tab-kiln').classList.contains('hidden')) {
                        renderKiln();
                    }
                    if (!state.kiln.active) { clearInterval(kilnTimer); kilnTimer = null; }
                }, 500);
            }

            function claimKiln() {
                if (!state.kiln.active) return;
                if (Date.now() - state.kiln.startTime < CONFIG.kilnDuration) return;

                const emoji = state.kiln.pendingEmoji;
                const name = state.kiln.pendingName;
                state.collection.push({ emoji, name, time: Date.now() });
                addQuestProgress('hatch');
                state.kiln.active = false;
                state.kiln.startTime = 0;
                state.kiln.pendingEmoji = null;
                state.kiln.pendingName = null;

                addToast(`孵化成功：${name}`);
                renderKiln();
                renderCollection();
            }

            function renderCollectionBase() {
                const el = document.getElementById('tab-collection');

            // ============================================================
            // 妖怪合成（仿軒轅劍：兩隻妖怪合成為新妖怪）
            // ============================================================
            function fuseResult(a, b) {
                const ia = ENEMIES.findIndex(x => x.emoji === a.emoji), ib = ENEMIES.findIndex(x => x.emoji === b.emoji);
                const tier = Math.min(CONFIG.fuseMaxTier, Math.max(a.tier || 0, b.tier || 0) + 1);
                const lv = Math.min(10, Math.max(a.lv || 1, b.lv || 1));
                if (ia === ib) {
                    const t = (a.tier || 0) >= (b.tier || 0) ? a : b;
                    return { emoji: t.emoji, name: t.name, hue: t.hue || 0, key: t.fkey || null, tier, lv };
                }
                const i = Math.min(ia, ib), j = Math.max(ia, ib);
                const r = FUSE_RECIPES.find(x => x[0] === i && x[1] === j);
                return { emoji: ENEMIES[i].emoji, name: r[2], hue: (i * 47 + j * 83 + 40) % 360, key: i + '-' + j, tier, lv };
            }
            function renderFuse() {
                const el = document.getElementById('tab-fuse');
                if (!el) return;
                state.fuseSel = state.fuseSel.filter(t => state.collection.some(c => c.time === t));
                const sel = state.fuseSel.map(t => state.collection.find(c => c.time === t));
                const cost = CONFIG.fuseCost;
                const have = state.inventory.demonCore;
                let preview = '';
                let res = null;
                if (sel.length === 2) {
                    res = fuseResult(sel[0], sel[1]);
                    const known = !res.key || state.fused[res.key];
                    preview = `<div class="kiln-hint" style="text-align:center;color:#ffd166;font-weight:700;">預覽：${known ? res.name + ' ★' + res.tier : '???'}</div>` +
                        (known ? '' : '<div class="kiln-hint" style="text-align:center;">首次合成將解鎖圖鑑</div>');
                }
                const slot = c => `<div class="fuse-slot">${c ? fxSpr(c, { px: 56 }) : '<span style="color:#6a8aaf;font-size:22px;">?</span>'}</div>`;
                const canGo = sel.length === 2 && have >= cost;
                let btnLabel = '開始合成';
                if (sel.length < 2) btnLabel = '請先選擇 2 隻材料';
                else if (have < cost) btnLabel = `妖丹不足（需 ${cost} 顆）`;
                const own = state.collection.length < 2
                    ? '<div class="collection-empty">至少需要 2 隻妖怪才能合成</div>'
                    : '<div class="collection-grid">' + state.collection.map(c => `
                        <div class="collection-card fuse-card${state.fuseSel.includes(c.time) ? ' equipped' : ''}" data-fuse-pick="${c.time}">
                            <div class="collection-emoji">${fxSpr(c, { px: 48 })}</div>
                            <div class="collection-name">${dispName(c)}${c.tier ? ' ★' + c.tier : ''} Lv.${c.lv || 1}</div>
                        </div>`).join('') + '</div>';
                const found = FUSE_RECIPES.filter(r => state.fused[r[0] + '-' + r[1]]).length;
                const codex = '<div class="collection-grid" style="margin-top:6px;">' + FUSE_RECIPES.map(r => {
                    const k = r[0] + '-' + r[1];
                    const h = (r[0] * 47 + r[1] * 83 + 40) % 360;
                    const e = ENEMIES[r[0]];
                    return state.fused[k]
                        ? `<div class="dex-card"><div class="collection-emoji">${fxSpr({ emoji: e.emoji, hue: h, tier: 1 }, { px: 44 })}</div><div class="collection-name">${r[2]}</div></div>`
                        : `<div class="dex-card unknown"><div class="collection-emoji" style="filter:brightness(0) opacity(0.55)">${sprFor(e.emoji, { px: 44 })}</div><div class="collection-name">???</div></div>`;
                }).join('') + '</div>';
                el.innerHTML = `
                    <div class="kiln-wrap">
                        <div class="kiln-emoji">⚗️</div>
                        <div class="kiln-desc">合成爐</div>
                        <div class="kiln-hint">選兩隻妖怪放入爐中，合成為更強的新妖怪。</div>
                        <div class="kiln-hint">每次合成消耗 ${cost} 顆妖丹，材料妖怪會消失；階級越高，出戰加成越大。</div>
                        <div class="kiln-hint">合成次數越多，靈泉的可互動範圍越大。</div>
                        <div class="kiln-hint" style="color:#7be3b5; font-weight:700;">合成 ${state.fuseCount} 次 · 靈泉互動範圍 ${reachM()} 公尺</div>
                        <div class="kiln-hint" style="color:#ff8fe8;">突變機率 ${Math.round(CONFIG.mutateChance * 100)}%</div>
                        <div class="kiln-hint" style="color:#ffd166; font-weight:700;">當前妖丹：${have} 顆</div>
                        <div class="fuse-slots">${slot(sel[0])}<span class="fuse-op">+</span>${slot(sel[1])}</div>
                        ${preview}
                        <button class="btn-modal-action" id="btn-fuse-go" ${canGo ? '' : 'disabled'}>${btnLabel}</button>
                    </div>
                    <div class="kiln-hint" style="text-align:center;margin:12px 0 8px;">點選妖怪選為材料，再點一次取消</div>
                    ${own}
                    <div class="kiln-hint" style="text-align:center;margin:14px 0 4px;color:#ffd166;font-weight:700;">合成圖鑑 ${found}/${FUSE_RECIPES.length}</div>
                    ${codex}`;
            }
            function doFuse() {
                if (state.fuseSel.length !== 2) return;
                if (state.inventory.demonCore < CONFIG.fuseCost) { addToast('妖丹不足，無法合成'); return; }
                const a = state.collection.find(c => c.time === state.fuseSel[0]);
                const b = state.collection.find(c => c.time === state.fuseSel[1]);
                if (!a || !b) { state.fuseSel = []; renderFuse(); return; }
                const r = fuseResult(a, b);
                const mut = Math.random() < CONFIG.mutateChance;
                if (mut) { r.hue = (r.hue + 180) % 360; r.lv = Math.min(10, r.lv + 1); }
                const oldReach = reachM();
                state.fuseCount = (state.fuseCount || 0) + 1;
                state.inventory.demonCore -= CONFIG.fuseCost;
                if (state.companion && (state.companion.time === a.time || state.companion.time === b.time)) state.companion = null;
                state.collection = state.collection.filter(c => c !== a && c !== b);
                const entry = { emoji: r.emoji, name: r.name, time: Date.now(), lv: r.lv, exp: 0, tier: r.tier, hue: r.hue };
                if (mut) entry.mut = 1;
                if (a.shiny || b.shiny) entry.shiny = 1;
                if (r.key) { entry.fkey = r.key; state.fused[r.key] = 1; }
                state.collection.push(entry);
                state.fuseSel = [];
                sfx('pickup');
                addToast(`${dispName(a)} 與 ${dispName(b)} 合成為 ${dispName(entry)}！`);
                if (mut) addToast(`✦ 突變！${r.name} 變得更強了`);
                if (reachM() > oldReach) addToast(`靈泉互動範圍提升至 ${reachM()} 公尺`);
                updateAvatar();
                updateInventoryBadge();
                saveProgress();
                renderFuse(); renderCollection(); renderInventory(); renderKiln();
            }

            // ============================================================
            // 雷達
            // ============================================================
            function updateRadar() {
                if (!state.playerLatLng) return;
                const list = state.targets
                    .map(t => ({ id: t.id, elite: t.elite, boss: t.boss, dist: state.playerLatLng.distanceTo(t.latlng) }))
                    .sort((a, b) => a.dist - b.dist);

                        <span class="radar-dist">${Math.round(item.dist)}m</span>
                    </div>
                `).join('');
            }

            function updateTargetDistances() {
                if (!state.playerLatLng) return;
                for (const t of state.targets) {
                    const el = t.marker.getElement();
                    if (!el) continue;
                    const distEl = el.querySelector('.target-distance');

            function initCompass() {
                const handler = (e) => {
                    let heading = null;
                    if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) {
                        heading = e.webkitCompassHeading;
                    } else if (typeof e.alpha === 'number' && e.alpha !== null) {
                        heading = 360 - e.alpha;
                    }
                    if (heading != null) compassArrow.style.transform = `rotate(${-heading}deg)`;
                };
                if (typeof DeviceOrientationEvent !== 'undefined' &&
                    typeof DeviceOrientationEvent.requestPermission === 'function') {
                    btnCompass.addEventListener('click', function once() {
                        DeviceOrientationEvent.requestPermission().then(res => {
                            if (res === 'granted') window.addEventListener('deviceorientation', handler, true);
                        }).catch(() => {});
                        btnCompass.removeEventListener('click', once);
                    });
                } else if (window.DeviceOrientationEvent) {

                    state.tower = (d.tower && Array.isArray(d.tower.slots)) ? d.tower : { refined: 0, slots: [] };

                    if (d.world && d.world.gyms) d.world.gyms.forEach(g => { g.enemyName = fixName(g.enemyName); g.name = fixName(g.name); });

            // ---------- 任務 ----------
            const QUEST_POOL = [

            inventoryModal.addEventListener('click', (e) => {

                const fp = e.target.closest('[data-fuse-pick]');
                if (fp) {

                    const k = state.fuseSel.indexOf(t);

                    else { if (state.fuseSel.length >= 2) state.fuseSel.shift(); state.fuseSel.push(t); }
