            // ---------- 靈泉補給站 ----------
            function makeStopIcon(cooling) {
                return L.divIcon({
                    className: 'stop-marker' + (cooling ? ' cooling' : ''),
                    html: '<div class="stop-core">泉</div>',
                    iconSize: [50, 50], iconAnchor: [25, 25]
                });
            }
            function createStop(latlng, data) {
                const id = ++state.stopIdSeq;
                const cd = (data && data.cooldownUntil) || 0;
                const cooling = cd > Date.now();
                const marker = L.marker(latlng, { icon: makeStopIcon(cooling), interactive: true, zIndexOffset: 300 }).addTo(state.map);
                marker.on('click', () => spinStop(id));
                const st = { id, latlng, marker, cooldownUntil: cd };
                state.stops.push(st);
                if (cooling) {
                    setTimeout(() => { if (state.stops.includes(st)) st.marker.setIcon(makeStopIcon(false)); }, cd - Date.now());
                }
            }
            function spawnStops() {
                for (const st of state.stops) { if (state.map) state.map.removeLayer(st.marker); }
                state.stops = [];
                if (!state.playerLatLng || !state.map) return;
                const n = 3;
                const base = Math.random() * Math.PI * 2;
                const lat0 = state.playerLatLng.lat, lng0 = state.playerLatLng.lng;
                for (let i = 0; i < n; i++) {
                    const ang = base + i * (Math.PI * 2 / n) + (Math.random() - 0.5) * 0.5;
                    const dist = 50 + Math.random() * 200;
                    const lat = lat0 + Math.cos(ang) * dist / 111320;
                    const lng = lng0 + Math.sin(ang) * dist / (111320 * Math.cos(lat0 * Math.PI / 180));
                    createStop(L.latLng(lat, lng), null);
                }
            }
            function spinStop(id) {
                if (battle.active || !state.running) return;
                const st = state.stops.find(x => x.id === id);
                if (!st) return;
                if (st.cooldownUntil > Date.now()) {
                    addToast('靈泉恢復中 ' + Math.ceil((st.cooldownUntil - Date.now()) / 1000) + ' 秒');
                    return;
                }
                if (!state.usingFallback && state.playerLatLng) {
                    const d = state.playerLatLng.distanceTo(st.latlng);
                    if (d > reachM()) { addToast(`距離靈泉 ${Math.round(d)}m，靠近到 ${reachM()}m 內再來`); return; }
                }
                const got = [];
                const pool = [
                    ['qiPill', 30], ['swordCharm', 20], ['demonCore', 20], ['incense', 15], ['stones', 15]
                ];
                const total = pool.reduce((a, b) => a + b[1], 0);
                for (let i = 0; i < 3; i++) {
                    let r = Math.random() * total, pick = pool[0][0];
                    for (const [k, w] of pool) { if (r < w) { pick = k; break; } r -= w; }
                    if (pick === 'stones') {
                        const g = 3 + Math.floor(Math.random() * 4);
                        state.stones += g;
                        got.push('靈石×' + g);
                    } else {
                        state.inventory[pick]++;
                        got.push(ITEM_DEFS[pick].name + '×1');
                    }
                }
                state.stats.stops++;
                if (Math.random() < 0.3 && addEgg(pickEggType(), true)) got.push('妖卵×1');
                st.cooldownUntil = Date.now() + 120000;
                st.marker.setIcon(makeStopIcon(true));
                setTimeout(() => {
                    if (state.stops.find(x => x.id === id)) st.marker.setIcon(makeStopIcon(false));
                }, 120000);
                addQuestProgress('stop');
                sfx('pickup');
                updateInventoryBadge();
                updateHUD();
                addToast('靈泉補給：' + got.join('、'));
            }


            // ============================================================
            // 妖卵（步行孵化）/ 勳章 / 每日登入
            // ============================================================
            let _tm = 0;
            function nextTime() { _tm = Math.max(Date.now(), _tm + 1); return _tm; }
            const EGG_TYPES = [{ m: 500, w: 60, lv: 1, shiny: 0.03 }, { m: 1000, w: 30, lv: 2, shiny: 0.08 }, { m: 2000, w: 10, lv: 3, shiny: 0.2 }];
            function pickEggType() {
                let r = Math.random() * 100;
                for (let i = 0; i < EGG_TYPES.length; i++) { if (r < EGG_TYPES[i].w) return i; r -= EGG_TYPES[i].w; }
                return 0;
            }
            function addEgg(type, silent) {
                if (state.eggs.length >= CONFIG.eggSlots) { if (!silent) addToast('妖卵欄已滿，沒有獲得妖卵'); return false; }
                state.eggs.push({ t: type, prog: 0 });
                if (!silent) addToast(`獲得一顆妖卵（${EGG_TYPES[type].m} 公尺）`);
                return true;
            }
            function addEggProgress(m) {
                if (!state.eggs.length) return;
                for (const e of state.eggs) e.prog += m;
                const done = state.eggs.filter(e => e.prog >= EGG_TYPES[e.t].m);
                if (!done.length) return;
                state.eggs = state.eggs.filter(e => e.prog < EGG_TYPES[e.t].m);
                for (const e of done) {
                    const ty = EGG_TYPES[e.t];
                    const en = ENEMIES[Math.floor(Math.random() * ENEMIES.length)];
                    const c = { emoji: en.emoji, name: en.name, time: nextTime(), lv: ty.lv };
                    const sh = Math.random() < ty.shiny;
                    if (sh) { c.shiny = 1; c.hue = 70; state.stats.shinies++; }

                    state.stats.eggs++;
                    state.dex[en.name] = state.dex[en.name] || 1;

            const MEDALS = [
                { k: 'kills', icon: '⚔️', name: '斬妖人', desc: '累計斬殺妖邪', t: [10, 50, 200], get: () => state.stats.kills },

                { k: 'tower', icon: '🗼', name: '煉妖塔主', desc: '煉化妖怪', t: [3, 10, 30], get: () => state.tower.refined },
                { k: 'shiny', icon: '✦', name: '閃光獵人', desc: '收服閃光妖', t: [1, 3, 8], get: () => state.stats.shinies }

            const MEDAL_TIER = ['未獲得', '銅章', '銀章', '金章'];
            const MEDAL_REWARD = [10, 25, 60];
            let _medalBusy = false;
            function checkMedals() {
                if (_medalBusy || !state.medals) return;
                _medalBusy = true;
                try {
                    for (const m of MEDALS) {
                        const v = m.get();
                        let tier = 0;
                        for (let i = 0; i < m.t.length; i++) if (v >= m.t[i]) tier = i + 1;

            function dailyLogin() {

                const count = state.streak.date === yesterday ? (state.streak.count || 0) + 1 : 1;

                const day = ((count - 1) % 7) + 1;

            function sendToTower(c) {
                if (state.companion && state.companion.time === c.time) { addToast('請先收回出戰的妖寵'); return; }
                if (state.tower.slots.length >= towerSlots()) { addToast('煉妖塔已滿，請先領取或等待煉化完成'); return; }
                if (!window.confirm(trText(`確定將 ${dispName(c)} 送入煉妖塔？妖怪會被煉化消失。`))) return;
                const pw = towerPower(c);
                state.tower.slots.push({
                    name: dispName(c), start: Date.now(), end: Date.now() + Math.min(300, 20 + 25 * pw) * 1000,
                    core: 1 + Math.floor(pw / 3), stone: 4 * pw
                });
                state.collection = state.collection.filter(x => x !== c);
                state.fuseSel = state.fuseSel.filter(t => t !== c.time);
                addToast(`${dispName(c)} 已送入煉妖塔`);
                saveProgress();
                renderCollection(); renderFuse();
            }
            function claimTower(i) {
                const sl = state.tower.slots[i];
                if (!sl || Date.now() < sl.end) return;
                const core = sl.core, stone = sl.stone + towerLevel() * 2;
                state.tower.slots.splice(i, 1);
                const lvBefore = towerLevel();
                state.tower.refined++;
                state.inventory.demonCore += core;
                state.stones += stone;
                addToast(`煉化完成：妖丹 +${core}，靈石 +${stone}`);
                if (towerLevel() > lvBefore) addToast(`煉妖塔升到 Lv.${towerLevel()}！容量 ${towerSlots()}`);
                sfx('pickup');
                updateInventoryBadge();
                updateHUD();
                renderCollection(); renderFuse(); renderInventory();
            }
            function towerHtml() {
                const slots = state.tower.slots, cap = towerSlots(), now = Date.now();
                let rows = '';
                for (let i = 0; i < cap; i++) {
                    const sl = slots[i];
                    if (!sl) { rows += '<div class="tower-slot"><span>▫️</span><span style="color:#6a8aaf;">空位</span></div>'; continue; }
                    const left = Math.max(0, Math.ceil((sl.end - now) / 1000));
                    rows += `<div class="tower-slot"><span>🔥</span><span>${sl.name}</span>` + (left > 0
                        ? `<span style="margin-left:auto;color:#ffd166;">煉化中 · 剩 ${left} 秒</span>`
                        : `<button class="item-use-btn" data-tower-claim="${i}">領取煉化</button>`) + '</div>';
                }
                return `<div id="tower-box" class="egg-row" style="flex-direction:column;align-items:stretch;gap:0;">
                    <div style="font-weight:700;color:#ffd166;"><span>🗼</span> <span>煉妖塔 Lv.${towerLevel()} · 容量 ${slots.length}/${cap}</span></div>
                    <div class="kiln-hint" style="margin:4px 0;">將多餘的妖怪送入塔中煉化，換取妖丹與靈石；煉化越多，塔越高、容量越大。</div>
                    ${rows}
                    <button class="item-use-btn" data-tower-mode="1" style="margin-top:8px;align-self:center;">${state.towerMode ? '結束送入模式' : '送入煉妖塔'}</button>
                    ${state.towerMode ? '<div class="kiln-hint" style="text-align:center;color:#ff8fe8;margin-top:6px;">點選下方妖怪，即可送入煉妖塔</div>' : ''}
                </div>`;
            }
            setInterval(() => {
                const box = document.getElementById('tower-box');
                if (!box || !state.tower.slots.length) return;
                const panel = document.getElementById('tab-collection');
                if (!panel || panel.classList.contains('hidden') || inventoryModal.classList.contains('hidden')) return;
                box.outerHTML = towerHtml();
            }, 1000);


            // ============================================================
            // 聯機房間：房間名稱 + WebRTC 點對點（Trystero）。交換妖怪、共同討伐妖王。
            // 載入失敗時退回「同裝置分頁」模式（BroadcastChannel），方便單機測試。
            // ============================================================
            const NET_APP_ID = 'yujian-sword-quest-v1';
            const NET_MAX_PEERS = 7;
            const RAID_TTL = 10 * 60 * 1000;
            const Net = { room: '', mode: '', selfId: '', peers: {}, ignored: {}, send: null, leave: null, joining: false };
            let netTrade = null, netRaid = null, _nickMem = '';
            function esc(x) { return String(x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
            function cleanNick(n) { return String(n == null ? '' : n).replace(/[\u0000-\u001f<>&"']/g, '').trim().slice(0, 12); }
            function getNick() {
                if (_nickMem) return _nickMem;
                let n = '';
                try { n = cleanNick(localStorage.getItem('yujian_nick')); } catch (e) {}
                if (!n) { n = '道友' + Math.floor(1000 + Math.random() * 9000); }
                _nickMem = n;
                try { localStorage.setItem('yujian_nick', n); } catch (e) {}
                return n;
            }
            function setNick(n) {
                n = cleanNick(n);
                if (!n) return;
                _nickMem = n;
                try { localStorage.setItem('yujian_nick', n); } catch (e) {}
            }
            function pname(id) { return (Net.peers[id] && Net.peers[id].name) || '?'; }
            function sp(name) { return `<span data-i18n-skip>${esc(name)}</span>`; }
            function peerCount() { return Object.keys(Net.peers).length; }

            async function netJoin(roomName) {
                roomName = String(roomName || '').trim().slice(0, 32);
                if (!roomName) { addToast('請輸入房間名稱'); return; }
                if (Net.room || Net.joining) netLeave(true);
                Net.joining = true; renderRoom();
                let ok = false;
                try {
                    const mod = await Promise.race([
                        import('https://cdn.jsdelivr.net/npm/trystero@0.26.0/+esm'),
                        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 9000))
                    ]);
                    const room = mod.joinRoom({ appId: NET_APP_ID }, 'yj-' + roomName);
                    Net.selfId = mod.selfId;
                    const act = room.makeAction('g');
                    if (Array.isArray(act)) { Net.send = (d, to) => act[0](d, to || undefined); act[1]((d, id) => netRecv(d, id)); }
                    else { Net.send = (d, to) => act.send(d, to ? { target: to } : undefined); act.onMessage = (d, meta) => netRecv(d, meta && meta.peerId ? meta.peerId : meta); }
                    room.onPeerJoin = id => netPeerJoin(id);
                    room.onPeerLeave = id => netPeerLeave(id);
                    Net.leave = () => { try { room.leave(); } catch (e) {} };
                    Net.mode = 'p2p';
                    ok = true;
                } catch (e) { console.warn('trystero load failed:', e && e.message); }
                if (!ok) {
                    if (typeof BroadcastChannel === 'undefined') { Net.joining = false; renderRoom(); addToast('無法載入連線元件，已改為同裝置分頁模式'); return; }
                    const bc = new BroadcastChannel('yj-' + roomName);
                    Net.selfId = 'L' + Math.random().toString(36).slice(2, 8);
                    bc.onmessage = ev => {
                        const m = ev.data;
                        if (!m || m.from === Net.selfId || (m.to && m.to !== Net.selfId)) return;
                        if (m.sys === 'join') { netPeerJoin(m.from); bc.postMessage({ sys: 'here', from: Net.selfId, to: m.from }); return; }
                        if (m.sys === 'here') { netPeerJoin(m.from); return; }
                        if (m.sys === 'bye') { netPeerLeave(m.from); return; }
                        netRecv(m.d, m.from);
                    };
                    Net.send = (d, to) => bc.postMessage({ from: Net.selfId, to: to || null, d });
                    Net.leave = () => { try { bc.postMessage({ sys: 'bye', from: Net.selfId }); bc.close(); } catch (e) {} };
                    bc.postMessage({ sys: 'join', from: Net.selfId });
                    Net.mode = 'local';
                    addToast('無法載入連線元件，已改為同裝置分頁模式');
                }
                Net.room = roomName; Net.joining = false; Net.peers = {}; Net.ignored = {};
                netTrade = null;
                addToast(`已加入房間 ${roomName}`);
                renderRoom();
            }
            function netLeave(silent) {
                if (Net.leave) Net.leave();
                Net.room = ''; Net.mode = ''; Net.peers = {}; Net.ignored = {}; Net.send = null; Net.leave = null; Net.joining = false;
                netTrade = null;
                if (netRaid && !(battle.active && battle.mode === 'raid')) netRaid = null;
                if (!silent) renderRoom();
                updateRoomAlert();
            }
            function netPeerJoin(id) {
                if (!id || Net.peers[id] || Net.ignored[id]) return;
                if (peerCount() >= NET_MAX_PEERS) { Net.ignored[id] = 1; addToast('房間已滿（最多 8 人）'); return; }
                Net.peers[id] = { name: '…', hello: false };
                if (Net.send) Net.send({ t: 'hello', name: getNick() }, id);
                renderRoom();
            }
            function netPeerLeave(id) {
                const p = Net.peers[id];
                delete Net.peers[id]; delete Net.ignored[id];
                if (p && p.hello) addToast(`${p.name} 離開了房間`);
                if (netTrade && netTrade.peer === id) netTrade = null;
                renderRoom();
            }
            function netRecv(d, id) {
                if (!d || typeof d !== 'object' || !id || Net.ignored[id]) return;
                if (!Net.peers[id]) { if (d.t === 'hello') netPeerJoin(id); if (!Net.peers[id]) return; }
                switch (d.t) {
                    case 'hello': {
                        const first = !Net.peers[id].hello;
                        Net.peers[id].name = cleanNick(d.name) || '?';
                        Net.peers[id].hello = true;
                        if (first) addToast(`${Net.peers[id].name} 加入了房間`);
                        renderRoom();
                        break;
                    }
                    case 'trade-offer': onTradeOffer(id, d); break;
                    case 'trade-ok': onTradeOk(id, d); break;
                    case 'trade-cancel':
                        if (netTrade && netTrade.peer === id) { addToast(`${pname(id)} 取消了交換`); netTrade = null; renderRoom(); }
                        break;
                    case 'raid-start': onRaidStart(id, d); break;
                    case 'raid-dmg': onRaidDmg(id, d); break;
                }
            }

            // ---------- 交換 ----------
            function snapMon(c) { return { id: c.time, emoji: c.emoji, name: c.name, lv: c.lv || 1, tier: c.tier || 0, hue: c.hue || 0, mut: c.mut ? 1 : 0, shiny: c.shiny ? 1 : 0, fkey: c.fkey || null }; }
            function cleanMon(m) {
                if (!m || typeof m !== 'object') return null;
                const en = ENEMIES.find(e => e.emoji === m.emoji);
                if (!en) return null;
                const names = [en.name].concat(FUSE_RECIPES.map(r => r[2]));
                if (names.indexOf(m.name) < 0) return null;
                const out = { id: (+m.id) | 0, emoji: en.emoji, name: m.name, lv: Math.min(10, Math.max(1, m.lv | 0)), tier: Math.min(CONFIG.fuseMaxTier, Math.max(0, m.tier | 0)), hue: (((+m.hue || 0) % 360) + 360) % 360, exp: 0 };
                if (m.mut) out.mut = 1;
                if (m.shiny) out.shiny = 1;
                if (typeof m.fkey === 'string' && /^\d-\d$/.test(m.fkey)) out.fkey = m.fkey;
                return out;
            }
            function openTrade(peer) {
                if (!Net.peers[peer]) return;
                netTrade = { peer, mine: null, theirs: null, myOk: false, theirOk: false };
                renderRoom();
            }
            function offerMine(time) {
                if (!netTrade) return;
                const c = state.collection.find(x => x.time === time);
                if (!c || (state.companion && state.companion.time === c.time)) return;
                netTrade.mine = time; netTrade.myOk = false; netTrade.theirOk = false;
                Net.send({ t: 'trade-offer', mon: snapMon(c) }, netTrade.peer);
                renderRoom();
            }
            function onTradeOffer(id, d) {
                const mon = cleanMon(d.mon);
                if (!mon) return;
                if (!netTrade || netTrade.peer !== id) {
                    if (netTrade && netTrade.mine != null) return;
                    netTrade = { peer: id, mine: null, theirs: null, myOk: false, theirOk: false };
                    addToast(`${pname(id)} 向你提出交換`);
                    setRoomAlert(true);
                }
                netTrade.theirs = mon; netTrade.myOk = false; netTrade.theirOk = false;
                renderRoom();
            }
            function confirmTrade() {
                if (!netTrade || netTrade.mine == null || !netTrade.theirs) return;
                netTrade.myOk = true;
                Net.send({ t: 'trade-ok', sig: netTrade.mine + ':' + netTrade.theirs.id }, netTrade.peer);
                tryExecuteTrade();
                renderRoom();
            }
            function onTradeOk(id, d) {
                if (!netTrade || netTrade.peer !== id || netTrade.mine == null || !netTrade.theirs) return;
                if (d.sig !== netTrade.theirs.id + ':' + netTrade.mine) return;
                netTrade.theirOk = true;
                tryExecuteTrade();
                renderRoom();
            }
            function tryExecuteTrade() {
                const t = netTrade;
                if (!t || !t.myOk || !t.theirOk) return;
                const c = state.collection.find(x => x.time === t.mine);
                if (!c || (state.companion && state.companion.time === c.time)) { addToast('交換失敗：妖怪已不存在'); Net.send({ t: 'trade-cancel' }, t.peer); netTrade = null; return; }
                state.collection = state.collection.filter(x => x !== c);
                const got = Object.assign({}, t.theirs, { time: nextTime() });
                delete got.id;
                state.collection.push(got);
                state.dex[got.name] = state.dex[got.name] || 1;
                if (got.fkey) state.fused[got.fkey] = 1;
                state.fuseSel = state.fuseSel.filter(x => x !== c.time);
                netTrade = null;
                sfx('pickup');
                addToast(`交換成功！獲得 ${dispName(got)}`);
                saveProgress();
                renderCollection(); renderFuse();
            }
            function cancelTrade() {
                if (!netTrade) return;
                if (Net.send) Net.send({ t: 'trade-cancel' }, netTrade.peer);
                netTrade = null; renderRoom();
            }

            // ---------- 妖王討伐（團戰）----------
            function raidAlive() { return !!(netRaid && !netRaid.done && Date.now() - netRaid.t0 < RAID_TTL); }
            function raidRemaining() {
                if (!netRaid) return 0;
                let sum = 0;
                for (const k in netRaid.dmg) sum += netRaid.dmg[k];
                return Math.max(0, netRaid.max - sum);
            }
            function startRaid() {
                if (!Net.room || raidAlive()) return;
                const id = Math.random().toString(36).slice(2, 8);
                const idx = Math.floor(Math.random() * ENEMIES.length);
                const max = 120 * (peerCount() + 1) + 80;
                netRaid = { id, idx, max, dmg: {}, by: Net.selfId, t0: Date.now(), done: false };
                Net.send({ t: 'raid-start', id, idx, max });
                renderRoom();
            }
            function onRaidStart(from, d) {
                if (raidAlive()) return;
                const idx = d.idx | 0, max = d.max | 0;
                if (idx < 0 || idx >= ENEMIES.length || max < 100 || max > 1500 || typeof d.id !== 'string') return;
                netRaid = { id: d.id.slice(0, 12), idx, max, dmg: {}, by: from, t0: Date.now(), done: false };
                addToast(`${pname(from)} 發起了妖王討伐！到房間加入`);
                setRoomAlert(true);
                renderRoom();
            }
            function joinRaid() {
                if (!raidAlive() || raidRemaining() <= 0 || battle.active || !state.running) return;
                document.getElementById('room-modal').classList.add('hidden');
                enterBattle(null, 'raid');
            }
            function raidAddDmg(dmg) {
                netRaid.dmg[Net.selfId] = (netRaid.dmg[Net.selfId] || 0) + dmg;
                if (Net.send) Net.send({ t: 'raid-dmg', id: netRaid.id, total: netRaid.dmg[Net.selfId] });
            }
            function onRaidDmg(from, d) {
                if (!netRaid || netRaid.done || d.id !== netRaid.id) return;
                const total = Math.min(Math.max(0, d.total | 0), netRaid.max);
                netRaid.dmg[from] = Math.max(netRaid.dmg[from] || 0, total);
                const rem = raidRemaining();
                if (battle.active && battle.mode === 'raid') {
                    battle.enemyHp = rem; updateBattleHUD();
                    if (rem <= 0 && !battle.resolveLock) winBattle();
                } else if (rem <= 0) completeRaid();
                renderRoom();
            }
            function completeRaid() {
                if (!netRaid || netRaid.done) return;
                netRaid.done = true;
                const mine = netRaid.dmg[Net.selfId] || 0;
                let total = 0, top = 0;
                for (const k in netRaid.dmg) { total += netRaid.dmg[k]; top = Math.max(top, netRaid.dmg[k]); }
                setRoomAlert(false);
                if (mine <= 0) { addToast('討伐成功，但你沒有出力，沒有獎勵'); renderRoom(); return; }
                const mvp = mine >= top;
                const stones = 20 + Math.round(100 * mine / Math.max(1, total)) + (mvp ? 20 : 0);
                const cores = 2 + (mvp ? 1 : 0);
                state.stones += stones; state.inventory.demonCore += cores; state.inventory.incense += 1;
                state.stats.raids = (state.stats.raids || 0) + 1;
                state.score += 3;
                addEgg(2, true);
                addToast(`團戰勝利！靈石 +${stones}，妖丹 +${cores}，引妖香 +1`);
                if (mvp) addToast('✦ 全隊最高傷害，額外獎勵！');
                sfx('win');
                updateInventoryBadge(); updateHUD(); renderRoom();
            }
            function setRoomAlert(on) { const b = document.getElementById('btn-room'); if (b) b.classList.toggle('alert', !!on); }
            function updateRoomAlert() { if (!Net.room) setRoomAlert(false); }

            // ---------- 房間畫面 ----------
            function renderRoom() {
                const el = document.getElementById('room-body');
                if (!el) return;
                const ph = k => esc(trText(k));
                if (Net.joining) { el.innerHTML = '<div class="kiln-hint" style="text-align:center;">連線中…</div>'; return; }
                if (!Net.room) {
                    el.innerHTML = `
                        <div class="kiln-hint" style="margin-bottom:10px;">輸入房間名稱，與朋友（最多 8 人）一起交換妖怪、討伐妖王。房間名稱相同的人會連到一起。</div>
                        <input id="room-nick" class="room-input" maxlength="12" value="${esc(getNick())}" placeholder="${ph('你的暱稱')}" data-i18n-skip>
                        <input id="room-name" class="room-input" maxlength="32" placeholder="${ph('房間名稱')}" data-i18n-skip>
                        <div style="text-align:center;margin-top:10px;"><button class="btn-modal-action" data-room="join">加入房間</button></div>`;
                    return;
                }
                const n = peerCount() + 1;
                let html = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><div data-i18n-skip style="font-weight:700;color:#ffd166;flex:1;min-width:0;">${esc(trText('房間 ◆ · 成員 ' + n + '/8')).replace('◆', esc(Net.room))}</div><button class="item-use-btn" data-room="leave">離開房間</button></div>`;
                html += `<div class="kiln-hint" style="margin-bottom:8px;">${Net.mode === 'p2p' ? '連線方式：點對點（WebRTC）' : '連線方式：同裝置分頁（無法載入連線元件）'}</div>`;
                html += `<div class="room-peer">🧑 <span>我</span> ${sp(getNick())}</div>`;
                for (const id of Object.keys(Net.peers)) {
                    const p = Net.peers[id];
                    html += `<div class="room-peer">🧑 ${sp(p.name)}` + (p.hello ? `<button class="item-use-btn" data-room="trade" data-id="${esc(id)}">交換</button>` : '') + '</div>';
                }
                if (!peerCount()) html += '<div class="kiln-hint" style="text-align:center;margin:8px 0;">等待其他人加入…（把房間名稱告訴朋友）</div>';
                // 團戰
                html += '<div class="kiln-hint" style="text-align:center;margin:14px 0 6px;color:#ffd166;font-weight:700;">妖王討伐</div>';
                if (raidAlive()) {
                    const rem = raidRemaining(), pct = Math.round(rem / netRaid.max * 100);
                    html += `<div class="egg-row" style="flex-direction:column;align-items:stretch;gap:4px;"><div style="font-weight:700;color:#e8f2ff;">${sprFor(ENEMIES[netRaid.idx].emoji, { px: 36 })} ${ENEMIES[netRaid.idx].name}</div>
                        <div class="egg-info">討伐進度 ${rem} / ${netRaid.max}</div><div class="egg-bar"><i style="width:${pct}%"></i></div>
                        <div class="egg-info">我的傷害：${netRaid.dmg[Net.selfId] || 0}</div>` +
                        Object.keys(netRaid.dmg).filter(k => k !== Net.selfId).map(k => `<div class="egg-info">${sp(pname(k))}：${netRaid.dmg[k]}</div>`).join('') +
                        `<div style="text-align:center;margin-top:6px;"><button class="btn-modal-action" data-room="raid-join" ${rem > 0 && state.running ? '' : 'disabled'}>加入討伐</button></div></div>`;
                } else {
                    html += `<div class="kiln-hint" style="text-align:center;">目前沒有討伐。任何成員都能發起，全員傷害累計，打倒妖王大家都有獎勵。</div><div style="text-align:center;margin-top:8px;"><button class="btn-modal-action" data-room="raid-start">發起妖王討伐</button></div>`;
                }
                // 交換
                if (netTrade && Net.peers[netTrade.peer]) {
                    const t = netTrade;
                    const mine = t.mine != null ? state.collection.find(c => c.time === t.mine) : null;
                    html += `<div class="kiln-hint" style="text-align:center;margin:16px 0 6px;color:#ffd166;font-weight:700;">與 ${sp(pname(t.peer))} 交換妖怪</div>`;
                    html += `<div class="kiln-hint" style="text-align:center;">我提供 ⇄ 對方提供</div><div class="fuse-slots"><div class="fuse-slot">${mine ? fxSpr(mine, { px: 56 }) : '<span style="color:#6a8aaf;">?</span>'}</div><span class="fuse-op">⇄</span><div class="fuse-slot">${t.theirs ? fxSpr(t.theirs, { px: 56 }) : '<span style="color:#6a8aaf;">?</span>'}</div></div>`;
                    html += `<div class="kiln-hint" style="text-align:center;">${mine ? dispName(mine) : '尚未提供'} ⇄ ${t.theirs ? dispName(t.theirs) : '尚未提供'}</div>`;
                    const ok = mine && t.theirs;
                    html += `<div style="text-align:center;margin:8px 0;"><button class="btn-modal-action" data-room="confirm" ${ok && !t.myOk ? '' : 'disabled'}>${t.myOk ? '已確認，等待對方…' : '確認交換'}</button> <button class="item-use-btn" data-room="cancel">取消交換</button></div>`;
                    if (t.theirOk) html += '<div class="kiln-hint" style="text-align:center;color:#7be3b5;">對方已確認</div>';
                    html += '<div class="kiln-hint" style="text-align:center;margin:8px 0;">選擇要提供的妖怪（出戰中的妖寵不能交換）</div><div class="collection-grid">' +
                        state.collection.filter(c => !(state.companion && state.companion.time === c.time)).map(c => `<div class="collection-card fuse-card${t.mine === c.time ? ' equipped' : ''}" data-room="offer" data-id="${c.time}"><div class="collection-emoji">${fxSpr(c, { px: 44 })}</div><div class="collection-name">${dispName(c)}${c.tier ? ' ★' + c.tier : ''} Lv.${c.lv || 1}</div></div>`).join('') + '</div>';
                }
                el.innerHTML = html;
            }
            document.getElementById('btn-room').addEventListener('click', () => {
                if (battle.active) return;
                setRoomAlert(false);
                renderRoom();
                document.getElementById('room-modal').classList.remove('hidden');
            });
            document.getElementById('room-modal').addEventListener('click', (e) => {
                if (e.target.id === 'room-modal') { e.target.classList.add('hidden'); return; }
                const b = e.target.closest('[data-room]');
                if (!b || b.disabled) return;
                const act = b.dataset.room, id = b.dataset.id;
                if (act === 'join') {
                    const nick = document.getElementById('room-nick'), rn = document.getElementById('room-name');
                    if (nick) setNick(nick.value);
                    netJoin(rn ? rn.value : '');
                }
                else if (act === 'leave') netLeave();
                else if (act === 'trade') openTrade(id);
                else if (act === 'offer') offerMine(parseInt(id, 10));
                else if (act === 'confirm') confirmTrade();
                else if (act === 'cancel') cancelTrade();
                else if (act === 'raid-start') startRaid();
                else if (act === 'raid-join') joinRaid();
            });
            document.getElementById('btn-raid-leave').addEventListener('click', () => {
                if (battle.active && battle.mode === 'raid') { closeBattleOverlay(); resumeTargetTimeouts(); renderRoom(); }
            });

            // ---------- 擊敗記錄 / 收服 ----------
            function recordDefeat(name, emoji, chance, shiny) {
                if (!name) return;
                companionGainExp();
                state.dex[name] = (state.dex[name] || 0) + 1;
                if (Math.random() < chance) {
                    const c = { emoji, name, time: nextTime() };
                    if (shiny) { c.shiny = 1; c.hue = 70; state.stats.shinies++; }
                    state.collection.push(c);
                    addToast(`收服 ${shiny ? '閃光 · ' : ''}${name}！`);
                }
            }

            // ---------- 世界持久化 ----------
            function buildWorld() {
                if (!state.worldAnchor || !state.gyms.length) return null;
                return {
                    anchor: state.worldAnchor,
                    gyms: state.gyms.map(g => ({
                        lat: g.latlng.lat, lng: g.latlng.lng, name: g.name,
                        enemyName: g.enemyName, enemyEmoji: g.enemyEmoji,
                        owned: g.owned, cooldownUntil: g.cooldownUntil || 0, lastClaim: g.lastClaim || 0
                    })),
                    stops: state.stops.map(st => ({ lat: st.latlng.lat, lng: st.latlng.lng, cooldownUntil: st.cooldownUntil || 0 }))
                };
            }
            function restoreWorld() {
                const w = state.savedWorld;
                if (!w || !w.anchor || !state.playerLatLng || !state.map) return false;
                if (!w.gyms || !w.gyms.length || !w.stops) return false;
                if (L.latLng(w.anchor.lat, w.anchor.lng).distanceTo(state.playerLatLng) > 3000) return false;
                for (const g of state.gyms) state.map.removeLayer(g.marker);
                for (const st of state.stops) state.map.removeLayer(st.marker);
                state.gyms = []; state.stops = [];
                w.gyms.forEach((g, i) => createGym(L.latLng(g.lat, g.lng), i, g));
                w.stops.forEach(st => createStop(L.latLng(st.lat, st.lng), st));
                state.worldAnchor = w.anchor;
                return true;
            }

            // ---------- 道場產出 ----------
            function gymIncome(gym) {
                if (!gym.owned || !gym.lastClaim) return 0;
                return Math.min(30, Math.floor((Date.now() - gym.lastClaim) / 60000));
            }
            document.getElementById('btn-gym-collect').addEventListener('click', () => {
                const gym = state.gyms.find(g => g.id === currentGymId);
                if (!gym) return;
                const inc = gymIncome(gym);
                if (inc <= 0) return;
                state.stones += inc;
                gym.lastClaim = Date.now();
                addToast(`收取守衛產出：靈石 +${inc}`);
                updateHUD();
                openGymModal(gym.id);
            });

            // ---------- 晝夜 / 天氣 ----------
            function isNight() { const h = new Date().getHours(); return h < 6 || h >= 18; }
            function weatherFromCode(c) {
                if (c === 0 || c === 1) return { type: 'clear', name: '晴', icon: '☀️' };
                if (c === 2 || c === 3) return { type: 'cloud', name: '陰', icon: '☁️' };
                if (c === 45 || c === 48) return { type: 'fog', name: '霧', icon: '🌫️' };
                if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return { type: 'rain', name: '雨', icon: '🌧️' };
                if ((c >= 71 && c <= 77) || c === 85 || c === 86) return { type: 'snow', name: '雪', icon: '❄️' };
                if (c >= 95) return { type: 'storm', name: '雷雨', icon: '⛈️' };
                return { type: 'cloud', name: '陰', icon: '☁️' };
            }
            function eliteChance() {
                let c = 0.15;
                if (isNight()) c += 0.10;
                if (state.weather && (state.weather.type === 'snow' || state.weather.type === 'fog')) c += 0.08;
                return c;
            }
            function weatherStoneBonus() {
                if (!state.weather) return 0;
                if (state.weather.type === 'rain') return 1;
                if (state.weather.type === 'storm') return 2;
                return 0;
            }
            function updateEnvironment() {
                const night = isNight();
                document.body.classList.toggle('night', night);
                document.body.classList.toggle('day', !night);
                const badge = document.getElementById('env-badge');
                if (!badge) return;
                const w = state.weather;
                let hint = night ? '夜間精英更多' : '';
                if (w && (w.type === 'rain' || w.type === 'storm')) hint = '靈石加成';
                else if (w && (w.type === 'snow' || w.type === 'fog')) hint = '精英更多';
                badge.textContent = (night ? '🌙 夜' : '☀️ 晝') + (w ? ' · ' + w.icon + w.name : '') + (hint ? ' · ' + hint : '');
            }
            async function fetchWeather() {
                if (!state.playerLatLng) return;
                try {
                    const ctrl = new AbortController();
                    const tm = setTimeout(() => ctrl.abort(), 6000);
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${state.playerLatLng.lat.toFixed(3)}&longitude=${state.playerLatLng.lng.toFixed(3)}&current=weather_code`;
                    const res = await fetch(url, { signal: ctrl.signal });
                    clearTimeout(tm);
                    const data = await res.json();
                    if (data && data.current && typeof data.current.weather_code === 'number') {
                        state.weather = weatherFromCode(data.current.weather_code);
                        updateEnvironment();
                    }
                } catch (e) { /* 離線或被攔截時忽略 */ }
            }

            // ---------- 妖寵成長 ----------
            function getCompanionEntry() {
                if (!state.companion) return null;
                return state.collection.find(x => x.time === state.companion.time) || null;
            }
            function companionMul() {
                const c = getCompanionEntry();
                if (!c) return 1;
                return 1 + 0.10 + 0.02 * (c.lv || 1) + 0.06 * (c.tier || 0) + (c.mut ? 0.10 : 0) + (c.shiny ? 0.08 : 0);
            }
            function companionGainExp() {
                const c = getCompanionEntry();
                if (!c) return;
                const lv = c.lv || 1;
                if (lv >= 10) return;
                c.exp = (c.exp || 0) + 1;
                if (c.exp >= lv * 3) {
                    c.exp = 0;
                    c.lv = lv + 1;
                    addToast(`${c.name} 升到 Lv.${c.lv}！`);
                } else if (!c.lv) {
                    c.lv = 1;
                }
            }

            // ---------- 音效 ----------
            let soundOn = true;
            try { soundOn = localStorage.getItem('yujian_sound') !== '0'; } catch (e) {}
            let audioCtx = null;
            function tone(freq, dur, type, vol, slideTo) {
                try {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = type || 'sine';
                    const t0 = audioCtx.currentTime;
                    o.frequency.setValueAtTime(freq, t0);
                    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
                    g.gain.setValueAtTime(vol || 0.08, t0);
                    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(t0); o.stop(t0 + dur);
                } catch (e) {}
            }
            function sfx(kind) {
                if (!soundOn) return;
                if (kind === 'throw') tone(900, 0.18, 'triangle', 0.06, 300);
                else if (kind === 'hit') { tone(220, 0.15, 'square', 0.08, 90); }
                else if (kind === 'hurt') tone(140, 0.3, 'sawtooth', 0.09, 60);
                else if (kind === 'win') { tone(523, 0.12, 'triangle', 0.08); setTimeout(() => tone(659, 0.12, 'triangle', 0.08), 110); setTimeout(() => tone(784, 0.25, 'triangle', 0.08), 220); }
                else if (kind === 'pickup') { tone(660, 0.1, 'sine', 0.07); setTimeout(() => tone(990, 0.15, 'sine', 0.07), 90); }
            }

            // ---------- 設定 ----------

            function creditsHtml() {

                    的圖層合成，並對部分圖層重新著色（顏色已修改）。合成後的精靈圖以相同授權條款（CC-BY-SA 3.0 / GPL 3.0）分享。</div>

            function ensureKilnTimer() {
                if (!state.kiln.active || kilnTimer) return;

                        !document.getElementById('tab-kiln').classList.contains('hidden')) {

            function updateHUD() {
                checkMedals();
                saveProgress();
                scoreEl.textContent = state.score;
                hpEl.textContent = state.hp;
                const level = Math.floor(state.score / CONFIG.expPerLevel) + 1;
                const progress = (state.score % CONFIG.expPerLevel) / CONFIG.expPerLevel;
                if (state.lastLevel !== null && level > state.lastLevel) addToast(`升級！Lv.${level} · 傷害提升`);
                state.lastLevel = level;
                const sc = document.getElementById('stone-count');
                if (sc) sc.textContent = '💎 ' + state.stones;
                levelEl.textContent = level;
                expFillEl.style.width = (progress * 100) + '%';

            // ============================================================
            // 戰鬥：進入
            // ============================================================
            function enterBattle(targetId, mode, gymObj) {
                if (battle.active) return;
                mode = mode || 'normal';

                let targetData = null;
                if (mode === 'gym') {
                    if (!gymObj) return;
                    targetData = gymObj;
                } else if (mode === 'raid') {
                    if (!raidAlive() || raidRemaining() <= 0) return;
                    targetData = netRaid;
                } else {
                    targetData = state.targets.find(t => t.id === targetId);
                    if (!targetData) return;
                }

                battle.active = true;
                battle.mode = mode;
                battle.gym = mode === 'gym' ? gymObj : null;
                battle.target = mode === 'normal' ? targetData : null;
                battle.resolveLock = false;
                battle.charging = false;
                battle.dying = false;
                battle.dyingT = 0;
                battle.victoryHandled = false;
                battle.hurtFlash = 0;
                battle.swords = [];
                battle.aiming = false;
                battle.aimPointerId = null;

                // 敵人屬性（地圖上看到的妖怪就是對戰的妖怪）
                const template = mode === 'raid' ? ENEMIES[targetData.idx] : (mode === 'normal' && targetData.enemyIdx != null)
                    ? ENEMIES[targetData.enemyIdx]
                    : ENEMIES[Math.floor(Math.random() * ENEMIES.length)];
                battle.enemyName = (mode === 'gym' ? gymObj.enemyName : template.name);
                battle.enemyEmoji = (mode === 'gym' ? gymObj.enemyEmoji : template.emoji);
                const baseHp = CONFIG.enemyMinHp + Math.floor(Math.random() * (CONFIG.enemyMaxHp - CONFIG.enemyMinHp + 1));
                battle.elite = mode === 'normal' && !!targetData.elite;
                battle.boss = (mode === 'normal' && !!targetData.boss) || mode === 'raid';
                battle.enemyMaxHp = mode === 'gym' ? Math.floor(baseHp * CONFIG.gymHpMul)
                                  : (battle.boss ? Math.floor(baseHp * 3) : (battle.elite ? Math.floor(baseHp * 1.7) : baseHp));
                battle.baseName = battle.enemyName;
                battle.shiny = mode === 'normal' && !!targetData.shiny;
                if (battle.shiny) battle.enemyName = '閃光 · ' + battle.enemyName;
                if (battle.boss) battle.enemyName = '妖王·' + battle.enemyName;
                else if (battle.elite) battle.enemyName = '精英·' + battle.enemyName;
                if (mode === 'raid') battle.enemyMaxHp = targetData.max;
                battle.enemyHp = mode === 'raid' ? raidRemaining() : battle.enemyMaxHp;
                document.getElementById('btn-raid-leave').style.display = mode === 'raid' ? 'block' : 'none';
                battle.attackInterval = mode === 'gym'
                    ? Math.floor(CONFIG.enemyAttackInterval * CONFIG.gymAttackMul)
                    : CONFIG.enemyAttackInterval;

                // 飛劍符自動消耗
                if (state.inventory.swordCharm > 0) {
                    state.inventory.swordCharm--;
                    battle.damageBonus = 1.6;
                    updateInventoryBadge();
                } else {
                    battle.damageBonus = 1;
                }

                // 暫停目標倒計時
                for (const t of state.targets) { clearTimeout(t.timeoutId); t.timeoutId = null; }

                enemyNameEl.textContent = battle.enemyName;
                battleLogEl.innerHTML = '';
                updateBattleHUD();
                addBattleLog(`遭遇 ${battle.enemyName}${mode === 'gym' ? '（道場守軍）' : ''}！`);
                if (battle.damageBonus > 1) addBattleLog('⚔ 飛劍符加持，傷害提升');

                battleOverlay.classList.remove('hidden');
                applyBattleMode();

                requestAnimationFrame(() => {
                    layoutBattle();
                    startBattleLoop();
                });

                setTimeout(() => {
                    if (!battle.active) return;
                    scheduleEnemyAttack();
                }, mode === 'gym' ? 1800 : 2200);
            }

            const DEFAULT_HINT = '向上滑動手指，甩出飛劍！';
            function scheduleEnemyAttack() {
                if (battle.attackTimer) clearTimeout(battle.attackTimer);
                battle.attackTimer = setTimeout(() => {
                    if (!battle.active || battle.resolveLock) return;
                    // 前搖：妖邪蓄力，期間命中可打斷
                    battle.charging = true;
                    battle.chargeStart = performance.now();
                    battleHintEl.textContent = '⚠ 妖邪蓄力中！命中可打斷';
                    addBattleLog(`${battle.enemyName} 正在蓄力…`);
                    battle.attackTimer = setTimeout(() => {
                        if (!battle.active || battle.resolveLock) return;
                        const stillCharging = battle.charging;
                        battle.charging = false;
                        battleHintEl.textContent = DEFAULT_HINT;
                        if (stillCharging) enemyAttack();
                        if (battle.active && !battle.resolveLock) scheduleEnemyAttack();
                    }, CONFIG.enemyChargeTime);
                }, battle.attackInterval);
            }

            function enemyAttack() {
                if (!battle.active || battle.resolveLock || battle.dying) return;
                hitFlash.classList.add('active');
                battle.playerHurtAt = performance.now();
                sfx('hurt');
                setTimeout(() => hitFlash.classList.remove('active'), 160);
                state.hp = Math.max(0, state.hp - 1);
                updateHUD();
                updateBattleHUD();
                addBattleLog(`${battle.enemyName} 反擊！劍氣 -1`);
                if (state.hp <= 0) loseBattle();
            }

            // ============================================================
            // 戰鬥：渲染
            // ============================================================
            function layoutBattle() {
                const dpr = window.devicePixelRatio || 1;
                const w = window.innerWidth, h = window.innerHeight;
                battleCanvas.width = w * dpr;
                battleCanvas.height = h * dpr;
                battleCanvas.style.width = w + 'px';
                battleCanvas.style.height = h + 'px';
                bctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                battle.enemySize = Math.max(80, Math.min(150, Math.min(w, h) * 0.24));
                battle.enemyX = w / 2;
                battle.enemyBaseY = Math.max(h * 0.30, 190);
                battle.enemyY = battle.enemyBaseY;
            }

            function startBattleLoop() {
                if (battle.loopRunning) return;
                battle.loopRunning = true;
                battle.lastTs = 0;
                requestAnimationFrame(battleLoop);
            }
            function stopBattleLoop() { battle.loopRunning = false; }

            function battleLoop(ts) {
                if (!battle.loopRunning) return;
                const dt = battle.lastTs ? Math.min(64, ts - battle.lastTs) : 16;
                battle.lastTs = ts;
                updateBattle(dt, ts);
                drawBattle(ts);
                requestAnimationFrame(battleLoop);
            }

            function updateBattle(dt, ts) {
                const frameScale = dt / 16.67;
                if (battle.hurtFlash > 0) battle.hurtFlash = Math.max(0, battle.hurtFlash - dt / 220);
                const t = ts / 1000;
                battle.enemyY = battle.enemyBaseY + Math.sin(t * 2) * 10;

                for (let i = battle.swords.length - 1; i >= 0; i--) {
                    const s = battle.swords[i];
                    s.vy += CONFIG.throwGravity * frameScale;
                    s.x += s.vx * frameScale;
                    s.y += s.vy * frameScale;
                    s.angle = Math.atan2(s.vy, s.vx);
                    s.age += dt;

                    if (!s.hit && !battle.dying && battle.enemyHp > 0) {
                        const dx = s.x - battle.enemyX;
                        const dy = s.y - battle.enemyY;
                        const r = battle.enemySize * 1.05;
                        if (dx * dx + dy * dy < r * r) {
                            s.hit = true;
                            onSwordHit(Math.sqrt(dx * dx + dy * dy) / r);
                            battle.swords.splice(i, 1);
                            continue;
                        }
                    }
                    const w = window.innerWidth, h = window.innerHeight;
                    if (s.x < -150 || s.x > w + 150 || s.y > h + 150 || s.age > 3500) {
                        battle.swords.splice(i, 1);
                    }
                }

                if (battle.dying) {
                    battle.dyingT += dt / 900;
                    if (battle.dyingT >= 1 && !battle.victoryHandled) {
                        battle.victoryHandled = true;
                        finishBattleVictory();
                    }
                }
            }

            function drawBattle(ts) {
                const w = window.innerWidth, h = window.innerHeight;
                bctx.clearRect(0, 0, w, h);
                drawPlayerChar(ts);
                if (battle.enemyHp > 0 || battle.dying) drawEnemy(ts);
                if (battle.aiming) drawAimingPreview();
                else if (!battle.dying && !battle.resolveLock && battle.enemyHp > 0) drawIdleSword(ts);
                for (const s of battle.swords) drawFlyingSword(s.x, s.y, s.angle);
            }

            function snapSize(cssSize) {
                const dpr = window.devicePixelRatio || 1;
                const k = Math.max(1, Math.round(cssSize * dpr / SPR_FRAME));
                return SPR_FRAME * k / dpr;
            }
            function drawAtlasFrame(key, kind, frame, left, top, size) {
                const m = ATLAS_META[key];
                const a = m && m[kind];
                if (!a || !atlasReady) return;
                const f = Math.max(0, Math.min(a.n - 1, frame | 0));
                bctx.imageSmoothingEnabled = false;
                bctx.drawImage(atlasImg, f * SPR_FRAME, a.row * SPR_FRAME, SPR_FRAME, SPR_FRAME, left, top, size, size);
            }

            function drawEnemy(ts) {
                const e = enemyByEmoji(battle.enemyEmoji);
                const key = e ? e.name : null;
                let alpha = 1, y = battle.enemyY;
                let kind = 'idle', frame = Math.floor(ts / 480) % 2;
                if (battle.dying) {
                    const p = Math.min(1, battle.dyingT);
                    kind = 'hurt';
                    frame = Math.min(5, Math.floor(p / 0.65 * 6));
                    alpha = p < 0.6 ? 1 : Math.max(0, 1 - (p - 0.6) / 0.4);
                    y = battle.enemyBaseY;
                } else if (battle.charging) {
                    kind = 'atk';
                    frame = Math.min(5, Math.floor(((ts - (battle.chargeStart || ts)) / CONFIG.enemyChargeTime) * 6));
                } else if (battle.hurtFlash > 0.35) {
                    kind = 'hurt';
                    frame = 1;
                }
                const S = snapSize(battle.enemySize * 2.4);
                bctx.save();
                bctx.globalAlpha = alpha;
                bctx.translate(battle.enemyX, y);
                const glowR = battle.enemySize * 0.95;
                const grad = bctx.createRadialGradient(0, 0, glowR * 0.15, 0, 0, glowR);
                grad.addColorStop(0, 'rgba(255, 90, 90, 0.28)');
                grad.addColorStop(0.5, 'rgba(255, 60, 80, 0.12)');
                grad.addColorStop(1, 'rgba(255, 40, 60, 0)');
                bctx.fillStyle = grad;
                bctx.beginPath();
                bctx.arc(0, 0, glowR, 0, Math.PI * 2);
                bctx.fill();
                if (battle.charging) {
                    bctx.strokeStyle = 'rgba(255, 70, 70, 0.9)';
                    bctx.lineWidth = 4;
                    bctx.beginPath();
                    bctx.arc(0, 0, glowR * (0.75 + 0.1 * Math.sin(ts / 80)), 0, Math.PI * 2);
                    bctx.stroke();
                }
                if (battle.hurtFlash > 0) {
                    bctx.filter = `brightness(${1 + battle.hurtFlash * 1.6})`;
                }
                if (key) drawAtlasFrame(key, kind, frame, -S / 2, -S * 0.54, S);
                bctx.restore();
            }

            // 玩家（背影）：待機呼吸；甩劍時播放施法動作；被擊中時抖動泛紅
            function drawPlayerChar(ts) {
                const w = window.innerWidth, h = window.innerHeight;
                const S = snapSize(Math.min(w * 0.44, h * 0.23, 190));
                const { x, y } = getLaunchPoint();
                let kind = 'idleN', frame = Math.floor(ts / 520) % 2;
                if (battle.castStart && ts - battle.castStart < 440) {
                    kind = 'atk';
                    frame = Math.min(6, Math.floor((ts - battle.castStart) / 440 * 7));
                }
                let dx = 0;
                bctx.save();
                if (battle.playerHurtAt && ts - battle.playerHurtAt < 320) {
                    const k = 1 - (ts - battle.playerHurtAt) / 320;
                    dx = Math.sin(ts / 22) * 7 * k;
                    bctx.filter = `sepia(1) saturate(${2 + 4 * k}) hue-rotate(-35deg) brightness(${1 + 0.4 * k})`;
                }
                drawAtlasFrame('player', kind, frame, x - S / 2 + dx, y + 34, S);
                bctx.restore();
            }

            function getLaunchPoint() {
                return { x: window.innerWidth / 2, y: window.innerHeight * CONFIG.throwLaunchYRatio };
            }

            function drawIdleSword(ts) {
                const { x, y } = getLaunchPoint();
                const yy = y + Math.sin(ts / 400) * 4;
                bctx.save();
                const glow = bctx.createRadialGradient(x, yy, 4, x, yy, 40);
                glow.addColorStop(0, 'rgba(126, 200, 255, 0.5)');
                glow.addColorStop(1, 'rgba(126, 200, 255, 0)');
                bctx.fillStyle = glow;
                bctx.beginPath();
                bctx.arc(x, yy, 40, 0, Math.PI * 2);
                bctx.fill();
                bctx.restore();
                drawFlyingSword(x, yy, -Math.PI / 2);
            }

            function drawFlyingSword(x, y, angle) {
                bctx.save();
                bctx.translate(x, y);
                bctx.rotate(angle);
                const grad = bctx.createLinearGradient(-96, 0, 12, 0);
                grad.addColorStop(0, 'rgba(126, 200, 255, 0)');
                grad.addColorStop(0.7, 'rgba(126, 200, 255, 0.5)');
                grad.addColorStop(1, 'rgba(210, 240, 255, 0.95)');
                bctx.fillStyle = grad;
                bctx.shadowColor = '#7ec8ff';
                bctx.shadowBlur = 22;
                bctx.beginPath();
                bctx.moveTo(8, 0); bctx.lineTo(-96, 13); bctx.lineTo(-72, 0); bctx.lineTo(-96, -13);
                bctx.closePath(); bctx.fill();
                bctx.beginPath();
                bctx.moveTo(28, 0); bctx.lineTo(2, 6.5); bctx.lineTo(-10, 0); bctx.lineTo(2, -6.5);
                bctx.closePath();
                bctx.fillStyle = '#ffffff';
                bctx.shadowBlur = 28;
                bctx.fill();
                bctx.restore();
            }

            // ---- 瞄準預覽 ----
            function simulatePath(startX, startY, vx0, vy0) {
                const points = [{ x: startX, y: startY }];
                let x = startX, y = startY, vx = vx0, vy = vy0;
                const g = CONFIG.throwGravity;
                for (let i = 0; i < 120; i++) {
                    vy += g; x += vx; y += vy;
                    points.push({ x, y });
                    if (y > window.innerHeight + 80) break;
                    if (x < -80 || x > window.innerWidth + 80) break;
                }
                return points;
            }

            function computeThrowVelocity() {
                const dvx = battle.aimCurrent.x - battle.aimStart.x;
                const dvy = battle.aimCurrent.y - battle.aimStart.y;
                const len = Math.hypot(dvx, dvy);
                if (len < 1) return { vx: 0, vy: 0, len: 0 };
                const capped = Math.min(len, CONFIG.throwMaxDrag);
                const speed = capped * CONFIG.throwSpeedMul;
                return { vx: (dvx / len) * speed, vy: (dvy / len) * speed, len };
            }

            function drawAimingPreview() {
                const { vx, vy, len } = computeThrowVelocity();
                if (len < 15) return;
                const { x, y } = getLaunchPoint();
                drawFlyingSword(x, y, Math.atan2(vy, vx));
                const ratio = Math.min(len / CONFIG.throwMaxDrag, 1);
                bctx.save();
                bctx.translate(x, y + 36);
                bctx.fillStyle = 'rgba(0,0,0,0.5)';
                bctx.fillRect(-50, 0, 100, 6);
                bctx.fillStyle = ratio > 0.75 ? '#ffd166' : '#7ec8ff';
                bctx.fillRect(-50, 0, 100 * ratio, 6);
                bctx.restore();
            }

            // ============================================================
            // 手勢
            // ============================================================
            function onPointerDown(e) {
                if (!battle.active || battle.dying || battle.resolveLock) return;
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                try { battleCanvas.setPointerCapture(e.pointerId); } catch (err) {}
                battle.aiming = true;
                battle.aimPointerId = e.pointerId;
                battle.aimStart = { x: e.clientX, y: e.clientY };
                battle.aimCurrent = { x: e.clientX, y: e.clientY };
            }
            function onPointerMove(e) {
                if (!battle.aiming || e.pointerId !== battle.aimPointerId) return;
                battle.aimCurrent = { x: e.clientX, y: e.clientY };
            }
            function onPointerUp(e) {
                if (!battle.aiming || e.pointerId !== battle.aimPointerId) return;
                battle.aiming = false;
                battle.aimPointerId = null;
                const { vx, vy, len } = computeThrowVelocity();
                if (len < CONFIG.throwMinDrag) return;
                const { x, y } = getLaunchPoint();
                battle.swords.push({ x, y, vx, vy, angle: Math.atan2(vy, vx), hit: false, age: 0 });
                battle.castStart = performance.now();
                sfx('throw');
                battleHintEl.style.opacity = '0.35';
                setTimeout(() => { battleHintEl.style.opacity = ''; }, 200);
            }
            function onPointerCancel() {
                battle.aiming = false;
                battle.aimPointerId = null;
            }

            // ============================================================
            // 命中 / 勝負
            // ============================================================
            function onSwordHit(ratio) {
                if (battle.dying || battle.resolveLock) return;
                const baseDmg = 9 + Math.floor(Math.random() * 7);
                const level = Math.floor(state.score / CONFIG.expPerLevel) + 1;
                const lvMul = (1 + (level - 1) * CONFIG.levelDmgBonus) * (1 + UPG.dmg * 0.08) * companionMul();
                const q = ratio < 0.35 ? 1.5 : (ratio < 0.65 ? 1.25 : 1);
                const dmg = Math.round(baseDmg * battle.damageBonus * lvMul * q);
                battle.enemyHp = Math.max(0, battle.enemyHp - dmg);
                if (battle.mode === 'raid' && netRaid) { raidAddDmg(dmg); battle.enemyHp = raidRemaining(); }
                battle.hurtFlash = 1;
                sfx('hit');
                updateBattleHUD();
                addBattleLog(q === 1.5 ? `絕佳一擊！造成 ${dmg} 點傷害` : (q === 1.25 ? `精準一擊！造成 ${dmg} 點傷害` : `飛劍命中！造成 ${dmg} 點傷害`));
                if (battle.charging) {
                    battle.charging = false;
                    battleHintEl.textContent = DEFAULT_HINT;
                    addBattleLog('✦ 成功打斷妖邪蓄力！');
                }
                if (battle.enemyHp <= 0) winBattle();
            }

            function winBattle() {
                if (battle.resolveLock) return;
                battle.resolveLock = true;
                battle.charging = false;
                battleHintEl.textContent = DEFAULT_HINT;
                battle.dying = true;
                battle.dyingT = 0;
                if (battle.attackTimer) { clearTimeout(battle.attackTimer); battle.attackTimer = null; }
                addBattleLog(`${battle.enemyName} 被斬殺！`);
                sfx('win');
                battleHintEl.textContent = '斬妖成功！';
            }

            function loseBattle() {
                if (battle.resolveLock) return;
                battle.resolveLock = true;
                if (battle.attackTimer) { clearTimeout(battle.attackTimer); battle.attackTimer = null; }
                battle.charging = false;
                addBattleLog('劍氣耗盡，力竭撤退…');
                setTimeout(() => {
                    closeBattleOverlay();
                    onDefeatRetreat();
                }, 1100);
            }

            // 戰敗不再「遊戲結束」：保留進度，撤退並恢復部分劍氣
            function onDefeatRetreat() {
                state.hp = Math.min(CONFIG.maxHp, Math.max(state.hp, CONFIG.defeatRestoreHp));
                updateHUD();
                resumeTargetTimeouts();
                statusEl.textContent = '力竭撤退，運功調息後可再戰';
                addToast(`力竭撤退，劍氣恢復至 ${state.hp}`);
            }

            function finishBattleVictory() {
                const mode = battle.mode;
                const targetId = battle.target ? battle.target.id : null;
                const gym = battle.gym;
                const wasElite = !!battle.elite;
                const wasBoss = !!battle.boss;
                const baseName = battle.baseName, baseEmoji = battle.enemyEmoji;
                const wasShiny = !!battle.shiny;

                closeBattleOverlay();

                if (mode === 'raid') {
                    completeRaid();
                    updateHUD();
                    resumeTargetTimeouts();
                    statusEl.textContent = '團戰勝利！';
                    return;
                }

                if (mode === 'gym' && gym) {
                    // 攻佔道場
                    gym.owned = true;
                    gym.cooldownUntil = Date.now() + 90000;
                    if (!gym.lastClaim) gym.lastClaim = Date.now();
                    gym.marker.setIcon(makeGymIcon(true));

                    state.inventory.demonCore += 2;
                    state.inventory.swordCharm += 1;
                    updateInventoryBadge();

                    state.score += 2;
                    state.stones += 10;
                    addQuestProgress('gym');
                    state.stats.gyms++; state.stats.kills++; addEggProgress(50);
                    recordDefeat(baseName, baseEmoji, 1);
                    addQuestProgress('kill');
                    updateHUD();
                    resumeTargetTimeouts();
                    statusEl.textContent = '道場攻佔成功！獲得妖丹×2 飛劍符×1';
                    addToast(`攻佔 ${gym.name}！妖丹×2 飛劍符×1`);
                } else {
                    if (targetId !== null) removeTarget(targetId, true);
                    state.score += wasBoss ? 5 : (wasElite ? 2 : 1);
                    const gain = (wasBoss ? 20 + Math.floor(Math.random() * 6) : wasElite ? 5 + Math.floor(Math.random() * 4) : 1 + Math.floor(Math.random() * 3)) + weatherStoneBonus();
                    state.stones += gain;
                    addToast(`靈石 +${gain}${wasElite ? '（精英）' : ''}`);
                    addQuestProgress('kill');
                    if (wasElite) { addQuestProgress('elite'); state.inventory.demonCore++; updateInventoryBadge(); }
                    if (wasBoss) { state.inventory.demonCore += 2; state.inventory.incense++; updateInventoryBadge(); addToast('妖王掉落：妖丹×2 引妖香×1'); }
                    recordDefeat(baseName, baseEmoji, (wasBoss || wasShiny) ? 1 : (wasElite ? 0.5 : 0.2), wasShiny);
                    state.killCount++; state.stats.kills++; addEggProgress(50);
                    if (wasBoss) addEgg(2);
                    if (state.killCount % 10 === 0) {
                        addToast('⚠ 妖王現身！');
                        setTimeout(() => { if (state.running && !battle.active) spawnTarget({ boss: true }); }, 1500);
                    }

                    // 隨機掉落
                    const roll = Math.random();
                    let dropped = null;
                    if (roll < CONFIG.dropDemonCore) {
                        state.inventory.demonCore++;
                        dropped = '妖丹 ×1';
                    } else if (roll < CONFIG.dropDemonCore + CONFIG.dropQiPill) {
                        state.inventory.qiPill++;
                        dropped = '回氣丹 ×1';
                    } else if (roll < CONFIG.dropDemonCore + CONFIG.dropQiPill + CONFIG.dropSwordCharm) {
                        state.inventory.swordCharm++;
                        dropped = '飛劍符 ×1';
                    }
                    if (dropped) {
                        updateInventoryBadge();
                        addToast('獲得 ' + dropped);
                    }
                    updateHUD();
                    resumeTargetTimeouts();
                    statusEl.textContent = '一劍斬妖！';
                    setTimeout(() => {
                        if (state.running && !battle.active) spawnTarget();
                    }, 900);
                }
            }

            function closeBattleOverlay() {
                battle.active = false;
                battle.target = null;
                battle.gym = null;
                battle.mode = 'normal';
                battle.dying = false;
                battle.dyingT = 0;
                battle.swords = [];
                battle.aiming = false;
                battle.aimPointerId = null;
                battle.damageBonus = 1;
                battle.charging = false;
                document.getElementById('btn-raid-leave').style.display = 'none';
                if (battle.attackTimer) { clearTimeout(battle.attackTimer); battle.attackTimer = null; }
                stopBattleLoop();
                battleOverlay.classList.add('hidden');
                battleHintEl.textContent = '向上滑動手指，甩出飛劍！';
            }

            // ============================================================
            // 戰鬥 HUD
            // ============================================================
            function updateBattleHUD() {
                const pPct = Math.max(0, (state.hp / CONFIG.maxHp) * 100);
                playerHpFill.style.width = pPct + '%';
                playerHpText.textContent = state.hp + ' / ' + CONFIG.maxHp;
                const ePct = battle.enemyMaxHp > 0 ? Math.max(0, (battle.enemyHp / battle.enemyMaxHp) * 100) : 0;
                enemyHpFill.style.width = ePct + '%';
                enemyHpText.textContent = Math.max(0, battle.enemyHp) + ' / ' + battle.enemyMaxHp;
            }

            function addBattleLog(msg) {
                const line = document.createElement('div');
                line.className = 'battle-log-line';
                line.textContent = msg;
                battleLogEl.appendChild(line);
                battleLogEl.scrollTop = battleLogEl.scrollHeight;
                while (battleLogEl.children.length > 4) {
                    battleLogEl.removeChild(battleLogEl.firstChild);
                }
            }

            // ============================================================
            // 遊戲流程
            // ============================================================
            function startGame() {
                state.score = 0;
                state.hp = CONFIG.maxHp;
                state.running = true;
                state.inventory = { swordCharm: 0, qiPill: 0, demonCore: 0, incense: 0 };
                state.collection = [];
                state.kiln = { active: false, startTime: 0, pendingEmoji: null, pendingName: null };
                if (kilnTimer) { clearInterval(kilnTimer); kilnTimer = null; }
                state.stones = 0; state.companion = null; state.quests = []; state.questDate = '';
                state.walked = 0; state.dex = {}; state.fused = {}; state.fuseCount = 0; state.fuseSel = []; state.stats = { kills: 0, stops: 0, eggs: 0, gyms: 0, shinies: 0, raids: 0 }; state.medals = {}; state.eggs = []; state.streak = { date: '', count: 0 }; state.buddyAcc = 0; state.tower = { refined: 0, slots: [] }; state.towerMode = false; state.savedWorld = null; state.killCount = 0;
                state.lastLevel = null; state.regenAcc = 0;
                Object.assign(UPG, { hp: 0, dmg: 0, regen: 0 });
                const restored = loadProgress();   // 讀取上次存檔，進度不再丟失
                ensureQuests();
                setTimeout(dailyLogin, 1200);
                updateAvatar();
                ensureKilnTimer();
                updateInventoryBadge();

                for (const t of state.targets) {
                    clearTimeout(t.timeoutId);
                    if (state.map) state.map.removeLayer(t.marker);
                }
                state.targets = [];

                if (battle.attackTimer) { clearTimeout(battle.attackTimer); battle.attackTimer = null; }
                battle.active = false;
                stopBattleLoop();

                updateHUD();
                startOverlay.classList.add('hidden');
                gameoverOverlay.classList.add('hidden');
                battleOverlay.classList.add('hidden');

                statusEl.textContent = state.usingFallback
                    ? '預設位置（北京）· 點選妖邪或道場開始'
                    : '點選妖邪或道場開始';

                applyBattleMode();

                // 生成道場
                if (!restoreWorld()) {
                    spawnGyms();
                    spawnStops();
                    state.worldAnchor = { lat: state.playerLatLng.lat, lng: state.playerLatLng.lng };
                }
                updateEnvironment();
                fetchWeather();
                if (state.envTimer) clearInterval(state.envTimer);
                state.envTimer = setInterval(updateEnvironment, 60000);

                for (let i = 0; i < CONFIG.targetCount; i++) {
                    setTimeout(() => { if (state.running) spawnTarget(); }, i * 400);
                }

                // 劍氣自然恢復（戰鬥外）
                if (state.regenTimer) clearInterval(state.regenTimer);
                state.regenTimer = setInterval(() => {
                    if (state.running && !battle.active && state.hp < CONFIG.maxHp &&
                        (state.regenAcc = (state.regenAcc || 0) + 1) >= Math.max(6, CONFIG.hpRegenSeconds - UPG.regen * 3) &&
                        !(state.regenAcc = 0)) {
                        state.hp++;
                        updateHUD();
                        addToast('調息運功，劍氣 +1');
                    }
                }, 1000);
                if (restored) addToast(`已讀取存檔 · Lv.${Math.floor(state.score / CONFIG.expPerLevel) + 1}`);

                if (state.radarTimer) clearInterval(state.radarTimer);
                state.radarTimer = setInterval(() => {
                    if (state.running) {
                        updateRadar();
                        updateTargetDistances();
                    }
                }, 1000);
            }

            function endGame() {
                state.running = false;
                if (battle.attackTimer) { clearTimeout(battle.attackTimer); battle.attackTimer = null; }
                battle.active = false;
                stopBattleLoop();
                battleOverlay.classList.add('hidden');

                finalScoreEl.textContent = state.score;
                gameoverOverlay.classList.remove('hidden');

                if (state.watchId !== null) {
                    navigator.geolocation.clearWatch(state.watchId);
                    state.watchId = null;
                }

                for (const t of state.targets) {
                    clearTimeout(t.timeoutId);
                    if (state.map) state.map.removeLayer(t.marker);
                }
                state.targets = [];

                for (const g of state.gyms) {
                    if (state.map) state.map.removeLayer(g.marker);
                }
                state.gyms = [];

                if (state.radarTimer) {
                    clearInterval(state.radarTimer);
                    state.radarTimer = null;
                }
                if (state.regenTimer) {
                    clearInterval(state.regenTimer);
                    state.regenTimer = null;
                }
            }

            // ============================================================
            // 事件繫結
            // ============================================================
            btnStart.addEventListener('click', () => startGame());

            btnRestart.addEventListener('click', () => {
                if (state.playerLatLng) {
                    startGame();
                } else {
                    gameoverOverlay.classList.add('hidden');
                    startOverlay.classList.remove('hidden');
                    btnStart.textContent = '重新定位…';
                    btnStart.disabled = true;
                    startGeolocation((isFallback) => {
                        btnStart.textContent = '開始御劍';
                        btnStart.disabled = false;
                        if (!isFallback) statusEl.textContent = '定位成功 — 點選開始';
                    });
                }
            });

            battleCanvas.addEventListener('pointerdown', onPointerDown);
            battleCanvas.addEventListener('pointermove', onPointerMove);
            battleCanvas.addEventListener('pointerup', onPointerUp);
            battleCanvas.addEventListener('pointercancel', onPointerCancel);
            battleCanvas.addEventListener('pointerleave', (e) => {
                if (e.pointerType === 'mouse' && battle.aiming) onPointerUp(e);
            });

            window.addEventListener('resize', () => {
                if (state.map) state.map.invalidateSize();
                if (battle.active) layoutBattle();
            });

            window.addEventListener('orientationchange', () => {
                setTimeout(() => {
                    if (state.map) state.map.invalidateSize();
                    if (battle.active) layoutBattle();
                }, 250);
            });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden && state.running && !battle.active) {
                    statusEl.textContent = '遊戲暫停中… 回到頁面繼續';
                }
            });

            // ============================================================
            // 啟動
            // ============================================================
            initCompass();

            startGeolocation((isFallback) => {
                btnStart.textContent = '開始御劍';
                btnStart.disabled = false;
                if (!isFallback) statusEl.textContent = '定位成功 — 點選開始';
            });

        })();
    </script>
</body>
</html>
