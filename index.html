            // ============================================================
            // 战斗：进入
            // ============================================================
            function enterBattle(targetId, mode, gymObj) {
                if (battle.active) return;
                mode = mode || 'normal';

                let targetData = null;
                if (mode === 'gym') {
                    if (!gymObj) return;
                    targetData = gymObj;
                } else {
                    targetData = state.targets.find(t => t.id === targetId);
                    if (!targetData) return;
                }

                battle.active = true;
                battle.mode = mode;
                battle.gym = mode === 'gym' ? gymObj : null;
                battle.target = mode === 'normal' ? targetData : null;
                battle.resolveLock = false;
                battle.charging = false;
                battle.dying = false;
                battle.dyingT = 0;
                battle.victoryHandled = false;
                battle.hurtFlash = 0;
                battle.swords = [];
                battle.aiming = false;
                battle.aimPointerId = null;

                // 敌人属性
                const template = ENEMIES[Math.floor(Math.random() * ENEMIES.length)];
                battle.enemyName = (mode === 'gym' ? gymObj.enemyName : template.name);
                battle.enemyEmoji = (mode === 'gym' ? gymObj.enemyEmoji : template.emoji);
                const baseHp = CONFIG.enemyMinHp + Math.floor(Math.random() * (CONFIG.enemyMaxHp - CONFIG.enemyMinHp + 1));
                battle.elite = mode === 'normal' && !!targetData.elite;
                battle.enemyMaxHp = mode === 'gym' ? Math.floor(baseHp * CONFIG.gymHpMul)
                                  : (battle.elite ? Math.floor(baseHp * 1.7) : baseHp);
                if (battle.elite) battle.enemyName = '精英·' + battle.enemyName;
                battle.enemyHp = battle.enemyMaxHp;
                battle.attackInterval = mode === 'gym'
                    ? Math.floor(CONFIG.enemyAttackInterval * CONFIG.gymAttackMul)
                    : CONFIG.enemyAttackInterval;

                // 飞剑符自动消耗
                if (state.inventory.swordCharm > 0) {
                    state.inventory.swordCharm--;
                    battle.damageBonus = 1.6;
                    updateInventoryBadge();
                } else {
                    battle.damageBonus = 1;
                }

                // 暂停目标倒计时
                for (const t of state.targets) { clearTimeout(t.timeoutId); t.timeoutId = null; }

                enemyNameEl.textContent = battle.enemyName;
                battleLogEl.innerHTML = '';
                updateBattleHUD();
                addBattleLog(`遭遇 ${battle.enemyName}${mode === 'gym' ? '（道场守军）' : ''}！`);
                if (battle.damageBonus > 1) addBattleLog('⚔ 飞剑符加持，伤害提升');

                battleOverlay.classList.remove('hidden');
                applyBattleMode();

                requestAnimationFrame(() => {
                    layoutBattle();
                    startBattleLoop();
                });

                setTimeout(() => {
                    if (!battle.active) return;
                    scheduleEnemyAttack();
                }, mode === 'gym' ? 1800 : 2200);
            }

            const DEFAULT_HINT = '向上滑动手指，甩出飞剑！';
            function scheduleEnemyAttack() {
                if (battle.attackTimer) clearTimeout(battle.attackTimer);
                battle.attackTimer = setTimeout(() => {
                    if (!battle.active || battle.resolveLock) return;
                    // 前摇：妖邪蓄力，期间命中可打断
                    battle.charging = true;
                    battleHintEl.textContent = '⚠ 妖邪蓄力中！命中可打断';
                    addBattleLog(`${battle.enemyName} 正在蓄力…`);
                    battle.attackTimer = setTimeout(() => {
                        if (!battle.active || battle.resolveLock) return;
                        const stillCharging = battle.charging;
                        battle.charging = false;
                        battleHintEl.textContent = DEFAULT_HINT;
                        if (stillCharging) enemyAttack();
                        if (battle.active && !battle.resolveLock) scheduleEnemyAttack();
                    }, CONFIG.enemyChargeTime);
                }, battle.attackInterval);
            }

            function enemyAttack() {
                if (!battle.active || battle.resolveLock || battle.dying) return;
                hitFlash.classList.add('active');
                setTimeout(() => hitFlash.classList.remove('active'), 160);
                state.hp = Math.max(0, state.hp - 1);
                updateHUD();
                updateBattleHUD();
                addBattleLog(`${battle.enemyName} 反击！剑气 -1`);
                if (state.hp <= 0) loseBattle();
            }

            // ============================================================
            // 战斗：渲染
            // ============================================================
            function layoutBattle() {
                const dpr = window.devicePixelRatio || 1;
                const w = window.innerWidth, h = window.innerHeight;
                battleCanvas.width = w * dpr;
                battleCanvas.height = h * dpr;
                battleCanvas.style.width = w + 'px';
                battleCanvas.style.height = h + 'px';
                bctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                battle.enemySize = Math.max(80, Math.min(150, Math.min(w, h) * 0.24));
                battle.enemyX = w / 2;
                battle.enemyBaseY = Math.max(h * 0.30, 190);
                battle.enemyY = battle.enemyBaseY;
            }

            function startBattleLoop() {
                if (battle.loopRunning) return;
                battle.loopRunning = true;
                battle.lastTs = 0;
                requestAnimationFrame(battleLoop);
            }
            function stopBattleLoop() { battle.loopRunning = false; }

            function battleLoop(ts) {
                if (!battle.loopRunning) return;
                const dt = battle.lastTs ? Math.min(64, ts - battle.lastTs) : 16;
                battle.lastTs = ts;
                updateBattle(dt, ts);
                drawBattle(ts);
                requestAnimationFrame(battleLoop);
            }

            function updateBattle(dt, ts) {
                const frameScale = dt / 16.67;
                if (battle.hurtFlash > 0) battle.hurtFlash = Math.max(0, battle.hurtFlash - dt / 220);
                const t = ts / 1000;
                battle.enemyY = battle.enemyBaseY + Math.sin(t * 2) * 10;

                for (let i = battle.swords.length - 1; i >= 0; i--) {
                    const s = battle.swords[i];
                    s.vy += CONFIG.throwGravity * frameScale;
                    s.x += s.vx * frameScale;
                    s.y += s.vy * frameScale;
                    s.angle = Math.atan2(s.vy, s.vx);
                    s.age += dt;

                    if (!s.hit && !battle.dying && battle.enemyHp > 0) {
                        const dx = s.x - battle.enemyX;
                        const dy = s.y - battle.enemyY;
                        const r = battle.enemySize * 0.85;
                        if (dx * dx + dy * dy < r * r) {
                            s.hit = true;
                            onSwordHit();
                            battle.swords.splice(i, 1);
                            continue;
                        }
                    }
                    const w = window.innerWidth, h = window.innerHeight;
                    if (s.x < -150 || s.x > w + 150 || s.y > h + 150 || s.age > 3500) {
                        battle.swords.splice(i, 1);
                    }
                }

                if (battle.dying) {
                    battle.dyingT += dt / 900;
                    if (battle.dyingT >= 1 && !battle.victoryHandled) {
                        battle.victoryHandled = true;
                        finishBattleVictory();
                    }
                }
            }

            function drawBattle(ts) {
                const w = window.innerWidth, h = window.innerHeight;
                bctx.clearRect(0, 0, w, h);
                if (battle.enemyHp > 0 || battle.dying) drawEnemy(ts);
                if (battle.aiming) drawAimingPreview();
                else if (!battle.dying && !battle.resolveLock && battle.enemyHp > 0) drawIdleSword(ts);
                for (const s of battle.swords) drawFlyingSword(s.x, s.y, s.angle);
            }

            function drawEnemy(ts) {
                let alpha = 1, scale = 1, y = battle.enemyY;
                if (battle.dying) {
                    const p = Math.min(1, battle.dyingT);
                    alpha = 1 - p;
                    scale = 1 + p * 0.45;
                    y = battle.enemyY - p * 90;
                }
                bctx.save();
                bctx.globalAlpha = alpha;
                bctx.translate(battle.enemyX, y);
                const glowR = battle.enemySize * 0.85;
                const grad = bctx.createRadialGradient(0, 0, glowR * 0.15, 0, 0, glowR);
                grad.addColorStop(0, 'rgba(255, 90, 90, 0.35)');
                grad.addColorStop(0.5, 'rgba(255, 60, 80, 0.14)');
                grad.addColorStop(1, 'rgba(255, 40, 60, 0)');
                bctx.fillStyle = grad;
                bctx.beginPath();
                bctx.arc(0, 0, glowR, 0, Math.PI * 2);
                bctx.fill();
                if (battle.charging) {
                    bctx.strokeStyle = 'rgba(255, 70, 70, 0.9)';
                    bctx.lineWidth = 4;
                    bctx.beginPath();
                    bctx.arc(0, 0, glowR * (0.7 + 0.1 * Math.sin(ts / 80)), 0, Math.PI * 2);
                    bctx.stroke();
                }
                bctx.scale(scale, scale);
                if (battle.hurtFlash > 0) {
                    bctx.filter = `brightness(${1 + battle.hurtFlash * 2.2}) drop-shadow(0 0 30px rgba(255,255,220,0.9))`;
                } else {
                    bctx.filter = 'drop-shadow(0 0 22px rgba(255,80,80,0.6))';
                }
                bctx.font = `${battle.enemySize}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif`;
                bctx.textAlign = 'center';
                bctx.textBaseline = 'middle';
                bctx.fillText(battle.enemyEmoji, 0, 0);
                bctx.restore();
            }

            function getLaunchPoint() {
                return { x: window.innerWidth / 2, y: window.innerHeight * CONFIG.throwLaunchYRatio };
            }

            function drawIdleSword(ts) {
                const { x, y } = getLaunchPoint();
                const yy = y + Math.sin(ts / 400) * 4;
                bctx.save();
                const glow = bctx.createRadialGradient(x, yy, 4, x, yy, 40);
                glow.addColorStop(0, 'rgba(126, 200, 255, 0.5)');
                glow.addColorStop(1, 'rgba(126, 200, 255, 0)');
                bctx.fillStyle = glow;
                bctx.beginPath();
                bctx.arc(x, yy, 40, 0, Math.PI * 2);
                bctx.fill();
                bctx.restore();
                drawFlyingSword(x, yy, -Math.PI / 2);
            }

            function drawFlyingSword(x, y, angle) {
                bctx.save();
                bctx.translate(x, y);
                bctx.rotate(angle);
                const grad = bctx.createLinearGradient(-96, 0, 12, 0);
                grad.addColorStop(0, 'rgba(126, 200, 255, 0)');
                grad.addColorStop(0.7, 'rgba(126, 200, 255, 0.5)');
                grad.addColorStop(1, 'rgba(210, 240, 255, 0.95)');
                bctx.fillStyle = grad;
                bctx.shadowColor = '#7ec8ff';
                bctx.shadowBlur = 22;
                bctx.beginPath();
                bctx.moveTo(8, 0); bctx.lineTo(-96, 13); bctx.lineTo(-72, 0); bctx.lineTo(-96, -13);
                bctx.closePath(); bctx.fill();
                bctx.beginPath();
                bctx.moveTo(28, 0); bctx.lineTo(2, 6.5); bctx.lineTo(-10, 0); bctx.lineTo(2, -6.5);
                bctx.closePath();
                bctx.fillStyle = '#ffffff';
                bctx.shadowBlur = 28;
                bctx.fill();
                bctx.restore();
            }

            // ---- 瞄准预览 ----
            function simulatePath(startX, startY, vx0, vy0) {
                const points = [{ x: startX, y: startY }];
                let x = startX, y = startY, vx = vx0, vy = vy0;
                const g = CONFIG.throwGravity;
                for (let i = 0; i < 120; i++) {
                    vy += g; x += vx; y += vy;
                    points.push({ x, y });
                    if (y > window.innerHeight + 80) break;
                    if (x < -80 || x > window.innerWidth + 80) break;
                }
                return points;
            }

            function computeThrowVelocity() {
                const dvx = battle.aimCurrent.x - battle.aimStart.x;
                const dvy = battle.aimCurrent.y - battle.aimStart.y;
                const len = Math.hypot(dvx, dvy);
                if (len < 1) return { vx: 0, vy: 0, len: 0 };
                const capped = Math.min(len, CONFIG.throwMaxDrag);
                const speed = capped * CONFIG.throwSpeedMul;
                return { vx: (dvx / len) * speed, vy: (dvy / len) * speed, len };
            }

            function drawAimingPreview() {
                const { vx, vy, len } = computeThrowVelocity();
                if (len < 15) return;
                const { x, y } = getLaunchPoint();
                const path = simulatePath(x, y, vx, vy);
                bctx.save();
                bctx.setLineDash([6, 8]);
                bctx.lineWidth = 2.2;
                bctx.strokeStyle = 'rgba(126, 200, 255, 0.75)';
                bctx.shadowColor = '#7ec8ff';
                bctx.shadowBlur = 14;
                bctx.beginPath();
                bctx.moveTo(path[0].x, path[0].y);
                for (let i = 1; i < path.length; i++) bctx.lineTo(path[i].x, path[i].y);
                bctx.stroke();
                const last = path[path.length - 1];
                bctx.setLineDash([]);
                bctx.beginPath();
                bctx.arc(last.x, last.y, 5, 0, Math.PI * 2);
                bctx.fillStyle = 'rgba(255, 209, 102, 0.9)';
                bctx.fill();
                bctx.restore();
                drawFlyingSword(x, y, Math.atan2(vy, vx));
                const ratio = Math.min(len / CONFIG.throwMaxDrag, 1);
                bctx.save();
                bctx.translate(x, y + 36);
                bctx.fillStyle = 'rgba(0,0,0,0.5)';
                bctx.fillRect(-50, 0, 100, 6);
                bctx.fillStyle = ratio > 0.75 ? '#ffd166' : '#7ec8ff';
                bctx.fillRect(-50, 0, 100 * ratio, 6);
                bctx.restore();
            }

            // ============================================================
            // 手势
            // ============================================================
            function onPointerDown(e) {
                if (!battle.active || battle.dying || battle.resolveLock) return;
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                try { battleCanvas.setPointerCapture(e.pointerId); } catch (err) {}
                battle.aiming = true;
                battle.aimPointerId = e.pointerId;
                battle.aimStart = { x: e.clientX, y: e.clientY };
                battle.aimCurrent = { x: e.clientX, y: e.clientY };
            }
            function onPointerMove(e) {
                if (!battle.aiming || e.pointerId !== battle.aimPointerId) return;
                battle.aimCurrent = { x: e.clientX, y: e.clientY };
            }
            function onPointerUp(e) {
                if (!battle.aiming || e.pointerId !== battle.aimPointerId) return;
                battle.aiming = false;
                battle.aimPointerId = null;
                const { vx, vy, len } = computeThrowVelocity();
                if (len < CONFIG.throwMinDrag) return;
                const { x, y } = getLaunchPoint();
                battle.swords.push({ x, y, vx, vy, angle: Math.atan2(vy, vx), hit: false, age: 0 });
                battleHintEl.style.opacity = '0.35';
                setTimeout(() => { battleHintEl.style.opacity = ''; }, 200);
            }
            function onPointerCancel() {
                battle.aiming = false;
                battle.aimPointerId = null;
            }

            // ============================================================
            // 命中 / 胜负
            // ============================================================
            function onSwordHit() {
                if (battle.dying || battle.resolveLock) return;
                const baseDmg = 9 + Math.floor(Math.random() * 7);
                const level = Math.floor(state.score / CONFIG.expPerLevel) + 1;
                const lvMul = (1 + (level - 1) * CONFIG.levelDmgBonus) * (1 + UPG.dmg * 0.08) * (state.companion ? 1.12 : 1);
                const dmg = Math.round(baseDmg * battle.damageBonus * lvMul);
                battle.enemyHp = Math.max(0, battle.enemyHp - dmg);
                battle.hurtFlash = 1;
                updateBattleHUD();
                addBattleLog(`飞剑命中！造成 ${dmg} 点伤害`);
                if (battle.charging) {
                    battle.charging = false;
                    battleHintEl.textContent = DEFAULT_HINT;
                    addBattleLog('✦ 成功打断妖邪蓄力！');
                }
                if (battle.enemyHp <= 0) winBattle();
            }

            function winBattle() {
                if (battle.resolveLock) return;
                battle.resolveLock = true;
                battle.charging = false;
                battleHintEl.textContent = DEFAULT_HINT;
                battle.dying = true;
                battle.dyingT = 0;
                if (battle.attackTimer) { clearTimeout(battle.attackTimer); battle.attackTimer = null; }
                addBattleLog(`${battle.enemyName} 被斩杀！`);
                battleHintEl.textContent = '斩妖成功！';
            }

            function loseBattle() {
                if (battle.resolveLock) return;
                battle.resolveLock = true;
                if (battle.attackTimer) { clearTimeout(battle.attackTimer); battle.attackTimer = null; }
                battle.charging = false;
                addBattleLog('剑气耗尽，力竭撤退…');
                setTimeout(() => {
                    closeBattleOverlay();
                    onDefeatRetreat();
                }, 1100);
            }

            // 战败不再「游戏结束」：保留进度，撤退并恢复部分剑气
            function onDefeatRetreat() {
                state.hp = Math.min(CONFIG.maxHp, Math.max(state.hp, CONFIG.defeatRestoreHp));
                updateHUD();
                resumeTargetTimeouts();
                statusEl.textContent = '力竭撤退，运功调息后可再战';
                addToast(`力竭撤退，剑气恢复至 ${state.hp}`);
            }

            function finishBattleVictory() {
                const mode = battle.mode;
                const targetId = battle.target ? battle.target.id : null;
                const gym = battle.gym;
                const wasElite = !!battle.elite;

                closeBattleOverlay();

                if (mode === 'gym' && gym) {
                    // 攻占道场
                    gym.owned = true;
                    gym.marker.setIcon(makeGymIcon(true));

                    state.inventory.demonCore += 2;
                    state.inventory.swordCharm += 1;
                    updateInventoryBadge();

                    state.score += 2;
                    state.stones += 10;
                    addQuestProgress('gym');
                    addQuestProgress('kill');
                    updateHUD();
                    resumeTargetTimeouts();
                    statusEl.textContent = '道场攻占成功！获得妖丹×2 飞剑符×1';
                    addToast(`攻占 ${gym.name}！妖丹×2 飞剑符×1`);
                } else {
                    if (targetId !== null) removeTarget(targetId, true);
                    state.score += wasElite ? 2 : 1;
                    const gain = wasElite ? 5 + Math.floor(Math.random() * 4) : 1 + Math.floor(Math.random() * 3);
                    state.stones += gain;
                    addToast(`灵石 +${gain}${wasElite ? '（精英）' : ''}`);
                    addQuestProgress('kill');
                    if (wasElite) { addQuestProgress('elite'); state.inventory.demonCore++; updateInventoryBadge(); }

                    // 随机掉落
                    const roll = Math.random();
                    let dropped = null;
                    if (roll < CONFIG.dropDemonCore) {
                        state.inventory.demonCore++;
                        dropped = '妖丹 ×1';
                    } else if (roll < CONFIG.dropDemonCore + CONFIG.dropQiPill) {
                        state.inventory.qiPill++;
                        dropped = '回气丹 ×1';
                    } else if (roll < CONFIG.dropDemonCore + CONFIG.dropQiPill + CONFIG.dropSwordCharm) {
                        state.inventory.swordCharm++;
                        dropped = '飞剑符 ×1';
                    }
                    if (dropped) {
                        updateInventoryBadge();
                        addToast('获得 ' + dropped);
                    }
                    updateHUD();
                    resumeTargetTimeouts();
                    statusEl.textContent = '一剑斩妖！';
                    setTimeout(() => {
                        if (state.running && !battle.active) spawnTarget();
                    }, 900);
                }
            }

            function closeBattleOverlay() {
                battle.active = false;
                battle.target = null;
                battle.gym = null;
                battle.mode = 'normal';
                battle.dying = false;
                battle.dyingT = 0;
                battle.swords = [];
                battle.aiming = false;
                battle.aimPointerId = null;
                battle.damageBonus = 1;
                battle.charging = false;
                if (battle.attackTimer) { clearTimeout(battle.attackTimer); battle.attackTimer = null; }
                stopBattleLoop();
                battleOverlay.classList.add('hidden');
                battleHintEl.textContent = '向上滑动手指，甩出飞剑！';
            }

            // ============================================================
            // 战斗 HUD
            // ============================================================
            function updateBattleHUD() {
                const pPct = Math.max(0, (state.hp / CONFIG.maxHp) * 100);
                playerHpFill.style.width = pPct + '%';
                playerHpText.textContent = state.hp + ' / ' + CONFIG.maxHp;
                const ePct = battle.enemyMaxHp > 0 ? Math.max(0, (battle.enemyHp / battle.enemyMaxHp) * 100) : 0;
                enemyHpFill.style.width = ePct + '%';
                enemyHpText.textContent = Math.max(0, battle.enemyHp) + ' / ' + battle.enemyMaxHp;
            }

            function addBattleLog(msg) {
                const line = document.createElement('div');
                line.className = 'battle-log-line';
                line.textContent = msg;
                battleLogEl.appendChild(line);
                battleLogEl.scrollTop = battleLogEl.scrollHeight;
                while (battleLogEl.children.length > 4) {
                    battleLogEl.removeChild(battleLogEl.firstChild);
                }
            }

            // ============================================================
            // 游戏流程
            // ============================================================
            function startGame() {
                state.score = 0;
                state.hp = CONFIG.maxHp;
                state.running = true;
                state.inventory = { swordCharm: 0, qiPill: 0, demonCore: 0 };
                state.collection = [];
                state.kiln = { active: false, startTime: 0, pendingEmoji: null, pendingName: null };
                if (kilnTimer) { clearInterval(kilnTimer); kilnTimer = null; }
                state.stones = 0; state.companion = null; state.quests = []; state.questDate = '';
                state.lastLevel = null; state.regenAcc = 0;
                Object.assign(UPG, { hp: 0, dmg: 0, regen: 0 });
                const restored = loadProgress();   // 读取上次存档，进度不再丢失
                ensureQuests();
                updateAvatar();
                ensureKilnTimer();
                updateInventoryBadge();

                for (const t of state.targets) {
                    clearTimeout(t.timeoutId);
                    if (state.map) state.map.removeLayer(t.marker);
                }
                state.targets = [];

                if (battle.attackTimer) { clearTimeout(battle.attackTimer); battle.attackTimer = null; }
                battle.active = false;
                stopBattleLoop();

                updateHUD();
                startOverlay.classList.add('hidden');
                gameoverOverlay.classList.add('hidden');
                battleOverlay.classList.add('hidden');

                statusEl.textContent = state.usingFallback
                    ? '默认位置（北京）· 点击妖邪或道场开始'
                    : '点击妖邪或道场开始';

                applyBattleMode();

                // 生成道场
                spawnGyms();

                for (let i = 0; i < CONFIG.targetCount; i++) {
                    setTimeout(() => { if (state.running) spawnTarget(); }, i * 400);
                }

                // 剑气自然恢复（战斗外）
                if (state.regenTimer) clearInterval(state.regenTimer);
                state.regenTimer = setInterval(() => {
                    if (state.running && !battle.active && state.hp < CONFIG.maxHp &&
                        (state.regenAcc = (state.regenAcc || 0) + 1) >= Math.max(6, CONFIG.hpRegenSeconds - UPG.regen * 3) &&
                        !(state.regenAcc = 0)) {
                        state.hp++;
                        updateHUD();
                        addToast('调息运功，剑气 +1');
                    }
                }, 1000);
                if (restored) addToast(`已读取存档 · Lv.${Math.floor(state.score / CONFIG.expPerLevel) + 1}`);

                if (state.radarTimer) clearInterval(state.radarTimer);
                state.radarTimer = setInterval(() => {
                    if (state.running) {
                        updateRadar();
                        updateTargetDistances();
                    }
                }, 1000);
            }

            function endGame() {
                state.running = false;
                if (battle.attackTimer) { clearTimeout(battle.attackTimer); battle.attackTimer = null; }
                battle.active = false;
                stopBattleLoop();
                battleOverlay.classList.add('hidden');

                finalScoreEl.textContent = state.score;
                gameoverOverlay.classList.remove('hidden');

                if (state.watchId !== null) {
                    navigator.geolocation.clearWatch(state.watchId);
                    state.watchId = null;
                }

                for (const t of state.targets) {
                    clearTimeout(t.timeoutId);
                    if (state.map) state.map.removeLayer(t.marker);
                }
                state.targets = [];

                for (const g of state.gyms) {
                    if (state.map) state.map.removeLayer(g.marker);
                }
                state.gyms = [];

                if (state.radarTimer) {
                    clearInterval(state.radarTimer);
                    state.radarTimer = null;
                }
                if (state.regenTimer) {
                    clearInterval(state.regenTimer);
                    state.regenTimer = null;
                }
            }

            // ============================================================
            // 事件绑定
            // ============================================================
            btnStart.addEventListener('click', () => startGame());

            btnRestart.addEventListener('click', () => {
                if (state.playerLatLng) {
                    startGame();
                } else {
                    gameoverOverlay.classList.add('hidden');
                    startOverlay.classList.remove('hidden');
                    btnStart.textContent = '重新定位…';
                    btnStart.disabled = true;
                    startGeolocation((isFallback) => {
                        btnStart.textContent = '开始御剑';
                        btnStart.disabled = false;
                        if (!isFallback) statusEl.textContent = '定位成功 — 点击开始';
                    });
                }
            });

            battleCanvas.addEventListener('pointerdown', onPointerDown);
            battleCanvas.addEventListener('pointermove', onPointerMove);
            battleCanvas.addEventListener('pointerup', onPointerUp);
            battleCanvas.addEventListener('pointercancel', onPointerCancel);
            battleCanvas.addEventListener('pointerleave', (e) => {
                if (e.pointerType === 'mouse' && battle.aiming) onPointerUp(e);
            });

            window.addEventListener('resize', () => {
                if (state.map) state.map.invalidateSize();
                if (battle.active) layoutBattle();
            });

            window.addEventListener('orientationchange', () => {
                setTimeout(() => {
                    if (state.map) state.map.invalidateSize();
                    if (battle.active) layoutBattle();
                }, 250);
            });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden && state.running && !battle.active) {
                    statusEl.textContent = '游戏暂停中… 回到页面继续';
                }
            });

            // ============================================================
            // 启动
            // ============================================================
            initCompass();

            startGeolocation((isFallback) => {
                btnStart.textContent = '开始御剑';
                btnStart.disabled = false;
                if (!isFallback) statusEl.textContent = '定位成功 — 点击开始';
            });

        })();
    </script>
</body>
</html>
